<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#F7F4EC">

<title>Immobilière du Golf — Boîtage</title>

<style>

:root {
  --green: #064B2E;
  --green-dark: #033B24;
  --green-soft: #E8EFEA;

  --cream: #F7F4EC;
  --cream-card: #FFFCF6;

  --gold: #B99A5E;

  --border: rgba(6,75,46,.15);
  --muted: #66756D;

  --shadow:
    0 12px 35px rgba(20,50,35,.07);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #fffdf8 0,
      var(--cream) 45%,
      #f2eee5 100%
    );

  color: var(--green-dark);
}

.app {
  width: 100%;
  max-width: 620px;

  margin: auto;

  padding:
    env(safe-area-inset-top)
    17px
    calc(35px + env(safe-area-inset-bottom));
}

.brand {
  padding: 25px 10px 28px;
  text-align: center;
}

.logo-box {
  position: relative;
  width: min(360px, 88%);
  margin: auto;
}

.logo-box img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

.brand-rule {
  width: 42px;
  height: 1px;
  margin: 25px auto 13px;
  background: var(--gold);
}

.brand-subtitle {
  margin: 0;
  color: var(--green);
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
}

.connection {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  min-height: 28px;
  margin-bottom: 14px;

  font-size: 12px;
  font-weight: 600;

  color: var(--green);
}

.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--gold);
}

.connection.ok .status-dot {
  background: #48A66D;
}

.connection.error .status-dot {
  background: #C76161;
}

.connection.wait .status-dot {
  background: var(--gold);
}

.card {
  margin-bottom: 15px;
  padding: 21px;

  background:
    rgba(255,252,246,.92);

  border: 1px solid var(--border);
  border-radius: 17px;

  box-shadow: var(--shadow);
}

.section-title {
  margin-bottom: 11px;

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: var(--gold);
}

.street-card {
  position: relative;
  overflow: hidden;
}

.street-card::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 3px;

  background:
    linear-gradient(
      90deg,
      var(--green),
      var(--gold),
      var(--green)
    );
}

.street-name {
  margin-top: 3px;

  color: var(--green-dark);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 29px;
  font-weight: 500;

  line-height: 1.12;
}

.street-meta {
  margin-top: 8px;

  color: var(--muted);

  font-size: 13px;
}

.tag {
  display: inline-flex;

  align-items: center;

  margin-top: 12px;

  padding: 6px 10px;

  border-radius: 30px;

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 1px;
}

.tag.oui {
  background: #E7F2EA;
  color: #327149;
}

.tag.non {
  background: #F4E9E5;
  color: #985C4A;
}

.current-container {
  margin-top: 22px;

  padding-top: 18px;

  border-top:
    1px solid var(--border);

  text-align: center;
}

.current-label {
  color: var(--muted);

  font-size: 10px;
  font-weight: 600;

  letter-spacing: 1.3px;

  text-transform: uppercase;
}

.current-number {
  margin-top: 4px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: var(--green);

  font-size: 57px;
  font-weight: 500;

  line-height: 1;
}

.current-unit {
  margin-top: 4px;

  color: var(--gold);

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 2px;
}

input {
  appearance: none;
  -webkit-appearance: none;

  width: 100%;

  border: 1px solid var(--border);

  border-radius: 12px;

  background: #FFFFFF;

  color: var(--green-dark);

  outline: none;

  font-size: 17px;

  transition:
    border .2s,
    box-shadow .2s,
    background .2s;
}

input:focus {
  border-color:
    rgba(6,75,46,.55);

  box-shadow:
    0 0 0 4px rgba(6,75,46,.07);
}

input::placeholder {
  color: #A7AFA9;
}

.bal-input {
  height: 79px;

  padding: 6px 12px;

  text-align: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 42px;

  color: var(--green);

  background: #FFFEFB;
}

button {
  width: 100%;

  border: 0;
  outline: 0;

  cursor: pointer;

  font-family: inherit;
}

.primary {
  height: 57px;

  margin-top: 12px;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      var(--green),
      var(--green-dark)
    );

  color: #FFFDF7;

  box-shadow:
    0 9px 22px rgba(4,61,37,.17);

  font-size: 13px;
  font-weight: 700;

  letter-spacing: 1.7px;

  text-transform: uppercase;
}

.primary:active {
  transform: scale(.985);
}

.primary:disabled {
  opacity: .45;
  box-shadow: none;
}

.secondary {
  height: 48px;

  margin-top: 12px;

  border-radius: 12px;

  background: var(--green-soft);

  color: var(--green);

  font-size: 12px;
  font-weight: 700;

  letter-spacing: .4px;
}

.search-wrapper {
  position: relative;
}

.search-icon {
  position: absolute;

  left: 15px;
  top: 50%;

  transform: translateY(-50%);

  font-size: 16px;

  pointer-events: none;
}

#searchInput {
  height: 56px;

  padding:
    0
    15px
    0
    44px;
}

.search-results {
  display: none;

  max-height: 330px;

  margin-top: 7px;

  overflow-y: auto;

  border:
    1px solid var(--border);

  border-radius: 12px;

  background: white;

  box-shadow:
    0 12px 30px rgba(20,45,32,.1);
}

.result {
  padding: 13px 14px;

  border-bottom:
    1px solid rgba(6,75,46,.08);
}

.result:last-child {
  border-bottom: 0;
}

.result:active {
  background: var(--green-soft);
}

.result strong {
  display: block;

  color: var(--green-dark);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 16px;

  font-weight: 500;
}

.result small {
  display: block;

  margin-top: 4px;

  color: var(--muted);

  font-size: 11px;
}

.status {
  margin-top: 11px;

  text-align: center;

  font-size: 12px;
  font-weight: 600;
}

.status.ok {
  color: #327149;
}

.status.wait {
  color: #9D7B3F;
}

.status.error {
  color: #A85858;
}

details {
  margin-top: 20px;

  border-top:
    1px solid rgba(6,75,46,.1);

  color: var(--muted);
}

summary {
  padding: 18px 2px 8px;

  cursor: pointer;

  list-style: none;

  text-align: center;

  color: var(--muted);

  font-size: 10px;

  letter-spacing: 1.5px;

  text-transform: uppercase;
}

summary::-webkit-details-marker {
  display: none;
}

.gps-box {
  padding: 13px 5px;

  font-size: 11px;

  line-height: 1.8;
}

.footer {
  padding: 15px 0 25px;

  text-align: center;

  color: rgba(6,75,46,.45);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 11px;
}

@media (max-width: 430px) {

  .app {
    padding-left: 13px;
    padding-right: 13px;
  }

  .brand {
    padding-top: 17px;
    padding-bottom: 21px;
  }

  .street-name {
    font-size: 27px;
  }

  .card {
    padding: 18px;
  }

<body>

<div class="app">

  <header class="brand">

    <div class="logo-box">
      <img
        src="logo-agence.png"
        alt="Immobilière du Golf"
      >
    </div>

    <div class="brand-rule"></div>

    <p class="brand-subtitle">
      Suivi de prospection
    </p>

  </header>

  <div
    id="connection"
    class="connection"
  >
    <span class="status-dot"></span>

    <span id="globalStatus">
      Chargement de la base…
    </span>
  </div>

  <section class="card street-card">

    <div class="section-title">
      Rue active
    </div>

    <div
      id="streetName"
      class="street-name"
    >
      Aucune rue sélectionnée
    </div>

    <div
      id="streetMeta"
      class="street-meta"
    >
      En attente du GPS…
    </div>

    <div id="faitTag"></div>

    <div class="current-container">

      <div class="current-label">
        Total actuellement enregistré
      </div>

      <div
        id="currentBal"
        class="current-number"
      >
        —
      </div>

      <div class="current-unit">
        BAL
      </div>

    </div>

  </section>

  <section class="card">

    <div class="section-title">
      Boîtes aux lettres constatées
    </div>

    <input
      id="balInput"
      class="bal-input"
      type="number"
      inputmode="numeric"
      pattern="[0-9]*"
      min="0"
      step="1"
      placeholder="0"
      disabled
    >

    <button
      id="saveButton"
      class="primary"
      onclick="saveBAL()"
      disabled
    >
      Enregistrer
    </button>

    <div
      id="saveStatus"
      class="status"
    ></div>

  </section>

  <section class="card">

    <div class="section-title">
      Sélection manuelle
    </div>

    <div class="search-wrapper">

      <div class="search-icon">
        ⌕
      </div>

      <input
        id="searchInput"
        type="text"
        placeholder="Rechercher une rue…"
        autocomplete="off"
        oninput="searchStreet()"
      >

    </div>

    <div
      id="searchResults"
      class="search-results"
    ></div>

    <button
      class="secondary"
      onclick="clearManualSelection()"
    >
      Réactiver la détection GPS
    </button>

  </section>

  <details>

    <summary>
      Informations GPS
    </summary>

    <div class="gps-box">

      <div>
        Latitude :
        <span id="lat">—</span>
      </div>

      <div>
        Longitude :
        <span id="lng">—</span>
      </div>

      <div>
        Précision :
        <span id="accuracy">—</span>
      </div>

        Détection :
        <span id="rawStreet">—</span>
      </div>

    </div>

  </details>

  <footer class="footer">
    Immobilière du Golf
  </footer>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxEA7mzj-B1_LH_Sw8WWs0-nBNjwdAGcH4DMlQJ4IgkBdD-BS9v5Qg7ITpiZC_MdbbG/exec';

const GEOCODE_INTERVAL = 5000;
const GEOCODE_MIN_DISTANCE = 8;
const GEOCODE_RETRY_DELAY = 1500;
const REQUIRED_CONFIRMATIONS = 2;

let baseRues = [];
let activeEntry = null;

let manualMode = false;

let gpsWatchId = null;

let lastGpsLat = null;
let lastGpsLng = null;

let lastGeocodeLat = null;
let lastGeocodeLng = null;
let lastGeocodeTime = 0;

let geocodeRunning = false;
let geocodePending = false;
let retryTimer = null;

let candidateId = null;
let candidateCount = 0;

let loadingStreet = false;
let pendingStreetId = null;

let saving = false;


/* ==========================
   NORMALISATION
========================== */

function normalizeText(text) {

  return String(text || '')

    .normalize('NFD')

    .replace(
      /[\u0300-\u036f]/g,
      ''
    )

    .toLowerCase()

    .replace(
      /[’']/g,
      ' '
    )

    .replace(
      /[-_/]/g,
      ' '
    )

    .replace(
      /\b(chemin|chem|ch|impasse|imp|avenue|av|boulevard|bd|route|rue|allee|allée|lotissement|lot|traverse|montée|montee|place|cours)\b/g,
      ' '
    )

    .replace(
      /\s+/g,
      ' '
    )

    .trim();
}


/* ==========================
   JSONP
========================== */

function jsonp(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );

      params.callback =
        callbackName;

      const query =
        new URLSearchParams(
          params
        ).toString();

      const script =
        document.createElement(
          'script'
        );

      const timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                'Délai dépassé'
              )
            );

          },
          12000
        );

      function cleanup() {

        clearTimeout(
          timeout
        );

        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

        try {

          delete window[
            callbackName
          ];

        }
        catch(e) {}

      }

      window[
        callbackName
      ] =
        function(data) {

          cleanup();

          resolve(
            data
          );

        };

      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'Erreur réseau'
            )
          );

        };

      script.src =
        API_URL +
        '?' +
        query;

      document.body
        .appendChild(
          script
        );

    }
  );
}


/* ==========================
   BASE
========================== */

async function loadBase() {

  setGlobalStatus(
    'Chargement des rues…',
    'wait'
  );

  try {

    const data =
      await jsonp({
        action: 'liste'
      });

    if (!data.ok) {

      throw new Error(
        data.message ||
        'Erreur API'
      );

    }

    baseRues =
      data.rues || [];

    setGlobalStatus(
      baseRues.length +
      ' rues • GPS actif',
      'ok'
    );

    startGPS();

  }
  catch (err) {

    setGlobalStatus(
      'Connexion impossible',
      'error'
    );

  }

}


/* ==========================
   GPS
========================== */

function startGPS() {

  if (
    !navigator.geolocation
  ) {

    setGlobalStatus(
      'GPS indisponible',
      'error'
    );

    return;

  }

  gpsWatchId =
    navigator.geolocation
      .watchPosition(

        onPosition,

        onGpsError,

        {
          enableHighAccuracy: true,
          maximumAge: 1500,
          timeout: 12000
        }

      );

}


function onPosition(position) {

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;

  lastGpsLat = lat;
  lastGpsLng = lng;

  document
    .getElementById('lat')
    .textContent =
      lat.toFixed(6);

  document
    .getElementById('lng')
    .textContent =
      lng.toFixed(6);

  document
    .getElementById('accuracy')
    .textContent =
      '± ' +
      Math.round(accuracy) +
      ' m';

  if (
    manualMode
  ) {
    return;
  }

  scheduleGeocode(false);
}


function onGpsError(error) {

  let message =
    'Erreur GPS';

  if (
    error.code === 1
  ) {

    message =
      'Autorisation GPS refusée';

  }

  else if (
    error.code === 2
  ) {

    message =
      'Position GPS indisponible';

  }

  else if (
    error.code === 3
  ) {

    message =
      'Recherche GPS…';

  }

  setGlobalStatus(
    message,
    error.code === 3
      ? 'wait'
      : 'error'
  );

}


/* ==========================
   PLANIFICATION GEOCODAGE
========================== */

function scheduleGeocode(force) {

  if (
    manualMode
  ) {
    return;
  }

  if (
    lastGpsLat === null ||
    lastGpsLng === null
  ) {
    return;
  }

  const now =
    Date.now();

  let movedEnough = true;

  if (
    lastGeocodeLat !== null &&
    lastGeocodeLng !== null
  ) {

    const moved =
      distanceMeters(
        lastGeocodeLat,
        lastGeocodeLng,
        lastGpsLat,
        lastGpsLng
      );

    movedEnough =
      moved >=
      GEOCODE_MIN_DISTANCE;

  }

  const waitedEnough =
    now -
    lastGeocodeTime >=
    GEOCODE_INTERVAL;

  if (
    !force &&
    !waitedEnough &&
    !movedEnough
  ) {
    return;
  }

  if (
    geocodeRunning
  ) {

    geocodePending =
      true;

    return;

  }

  runGeocode(
    lastGpsLat,
    lastGpsLng,
    false
  );
}


/* ==========================
   DISTANCE
========================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const toRad =
    x =>
      x *
      Math.PI /
      180;

  const dLat =
    toRad(
      lat2 -
      lat1
    );

  const dLon =
    toRad(
      lon2 -
      lon1
    );

  const a =

    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(
      toRad(lat1)
    )

    *

    Math.cos(
      toRad(lat2)
    )

    *

    Math.sin(
      dLon / 2
    ) ** 2;

  return (

    2 *
    R *
    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    )

  );

}


/* ==========================
   NOMINATIM STABLE
========================== */

async function runGeocode(
  lat,
  lng,
  isRetry
) {

  if (
    geocodeRunning
  ) {
    return;
  }

  geocodeRunning =
    true;

  geocodePending =
    false;

  setGlobalStatus(
    baseRues.length +
    ' rues • recherche GPS…',
    'wait'
  );

  try {

    const url =

      'https://nominatim.openstreetmap.org/reverse' +

      '?format=jsonv2' +

      '&lat=' +
      encodeURIComponent(lat) +

      '&lon=' +
      encodeURIComponent(lng) +

      '&zoom=18' +

      '&addressdetails=1';

    const response =
      await fetch(
        url,
        {
          headers: {
            'Accept-Language': 'fr'
          }
        }
      );

    if (
      !response.ok
    ) {

      throw new Error(
        'Géocodage indisponible'
      );

    }

    const data =
      await response.json();

    const address =
      data.address || {};

    const rawStreet =

      address.road ||

      address.pedestrian ||

      address.residential ||

      address.path ||

      address.neighbourhood ||

      '';

    document
      .getElementById('rawStreet')
      .textContent =
        rawStreet ||
        'Non reconnue';

    lastGeocodeTime =
      Date.now();

    lastGeocodeLat =
      lat;

    lastGeocodeLng =
      lng;

    setGlobalStatus(
      baseRues.length +
      ' rues • GPS actif',
      'ok'
    );

    if (
      rawStreet
    ) {

      detectStreet(
        rawStreet
      );

    }

  }
  catch (err) {

    console.log(
      'Erreur géocodage',
      err
    );

    /*
      Une seule relance automatique.
    */

    if (
      !isRetry &&
      !manualMode
    ) {

      clearTimeout(
        retryTimer
      );

      retryTimer =
        setTimeout(
          () => {

            if (
              !manualMode &&
              lastGpsLat !== null &&
              lastGpsLng !== null
            ) {

              runGeocode(
                lastGpsLat,
                lastGpsLng,
                true
              );

            }

          },
          GEOCODE_RETRY_DELAY
        );

    }
    else {

      setGlobalStatus(
        baseRues.length +
        ' rues • GPS actif',
        'ok'
      );

    }

  }
  finally {

    geocodeRunning =
      false;

    /*
      Si une nouvelle position est arrivée pendant
      la requête, on la traite ensuite.
    */

    if (
      geocodePending &&
      !manualMode
    ) {

      geocodePending =
        false;

      setTimeout(
        () => {
          scheduleGeocode(false);
        },
        300
      );

    }

  }

}


/* ==========================
   DETECTION STABLE
========================== */

function detectStreet(
  rawStreet
) {

  if (
    manualMode
  ) {
    return;
  }

  const match =
    findBestMatch(
      rawStreet
    );

  if (
    !match
  ) {

    candidateId =
      null;

    candidateCount =
      0;

    return;

  }

  /*
    Si c'est déjà la rue active,
    inutile de refaire un appel API.
  */

  if (
    activeEntry &&
    activeEntry.id ===
    match.id
  ) {

    candidateId =
      match.id;

    candidateCount =
      REQUIRED_CONFIRMATIONS;

    return;

  }

  /*
    On demande 2 détections concordantes.
  */

  if (
    candidateId ===
    match.id
  ) {

    candidateCount++;

  }
  else {

    candidateId =
      match.id;

    candidateCount =
      1;

  }

  if (
    candidateCount >=
    REQUIRED_CONFIRMATIONS
  ) {

    candidateId =
      match.id;

    candidateCount =
      REQUIRED_CONFIRMATIONS;

    activateStreet(
      match.id,
      false
    );

  }

}


/* ==========================
   MATCH
========================== */

function findBestMatch(
  rawStreet
) {

  const raw =
    normalizeText(
      rawStreet
    );

  if (
    !raw
  ) {
    return null;
  }

  let best =
    null;

  let bestScore =
    0;

  for (
    const item
    of baseRues
  ) {

    const street =
      normalizeText(
        item.rue
      );

    if (
      !street
    ) {
      continue;
    }

    let score =
      0;

    if (
      street ===
      raw
    ) {

      score =
        100;

    }

    else if (

      street.includes(
        raw
      )

      ||

      raw.includes(
        street
      )

    ) {

      score =
        85;

    }

    else {

      const rawWords =
        raw.split(' ');

      const streetWords =
        street.split(' ');

      const common =
        rawWords.filter(
          word =>
            word.length >= 3 &&
            streetWords.includes(
              word
            )
        );

      if (
        common.length >= 2
      ) {

        score =

          50 +

          common.length *
          10;

      }

    }

    if (
      score >
      bestScore
    ) {

      bestScore =
        score;

      best =
        item;

    }

  }

  if (
    bestScore < 60
  ) {
    return null;
  }

  return best;

}


/* ==========================
   ACTIVE STREET
========================== */

async function activateStreet(
  id,
  fromManual
) {

  /*
    Si la même rue est déjà chargée,
    on ne refait rien.
  */

  if (
    activeEntry &&
    activeEntry.id === id &&
    !fromManual
  ) {
    return;
  }

  /*
    Si un chargement est déjà en cours,
    on mémorise la dernière rue demandée.
  */

  if (
    loadingStreet
  ) {

    pendingStreetId =
      id;

    return;

  }

  loadingStreet =
    true;

  pendingStreetId =
    null;

  setSaveStatus(
    'Synchronisation…',
    'wait'
  );

  try {

    const data =
      await jsonp({
        action: 'getRue',
        id: id
      });

    if (
      !data.ok
    ) {

      throw new Error(
        data.message ||
        'Rue introuvable'
      );

    }

    activeEntry =
      data;

    if (
      fromManual
    ) {

      manualMode =
        true;

    }

    displayActiveStreet();

    setSaveStatus(
      '',
      ''
    );

  }
  catch (err) {

    setSaveStatus(
      'Erreur temporaire de synchronisation',
      'error'
    );

  }
  finally {

    loadingStreet =
      false;

    /*
      Si une nouvelle rue a été détectée pendant
      le chargement, on la charge juste après.
    */

    if (
      pendingStreetId &&
      pendingStreetId !==
      activeEntry?.id
    ) {

      const nextId =
        pendingStreetId;

      pendingStreetId =
        null;

      setTimeout(
        () => {
          activateStreet(
            nextId,
            false
          );
        },
        200
      );

    }

  }

}


/* ==========================
   DISPLAY
========================== */

function displayActiveStreet() {

  if (
    !activeEntry
  ) {
    return;
  }

  document
    .getElementById('streetName')
    .textContent =
      activeEntry.rue;

  document
    .getElementById('streetMeta')
    .textContent =

      activeEntry.jour +

      '  •  n° ' +

      activeEntry.ordre +

      '  •  ' +

      activeEntry.type;

  document
    .getElementById('currentBal')
    .textContent =
      activeEntry.bal;

  const input =
    document
      .getElementById('balInput');

  input.disabled =
    false;

  input.value =
    activeEntry.bal;

  document
    .getElementById('saveButton')
    .disabled =
      false;

  const fait =

    String(
      activeEntry.fait ||
      ''
    )
    .toLowerCase();

  const tag =
    document
      .getElementById('faitTag');

  if (
    fait === 'oui'
  ) {

    tag.innerHTML =
      '<span class="tag oui">✓ FAIT</span>';

  }
  else {

    tag.innerHTML =
      '<span class="tag non">À FAIRE</span>';

  }

}


/* ==========================
   SAVE BAL
========================== */

async function saveBAL() {

  if (
    !activeEntry ||
    saving
  ) {
    return;
  }

  const input =
    document
      .getElementById('balInput');

  const bal =
    Number(
      input.value
    );

  if (
    !Number.isFinite(bal)
    ||
    bal < 0
    ||
    !Number.isInteger(bal)
  ) {

    setSaveStatus(
      'Entre un nombre valide.',
      'error'
    );

    return;

  }

  saving =
    true;

  document
    .getElementById('saveButton')
    .disabled =
      true;

  setSaveStatus(
    'Enregistrement…',
    'wait'
  );

  const currentId =
    activeEntry.id;

  try {

    const result =
      await jsonp({
        action: 'updateBAL',
        id: currentId,
        bal: bal
      });

    if (
      !result.ok
    ) {

      throw new Error(
        result.message ||
        'Erreur'
      );

    }

    const fresh =
      await jsonp({
        action: 'getRue',
        id: currentId
      });

    if (
      !fresh.ok
    ) {

      throw new Error(
        'Relecture impossible'
      );

    }

    activeEntry =
      fresh;

    const baseIndex =
      baseRues.findIndex(
        x =>
          x.id ===
          activeEntry.id
      );

    if (
      baseIndex !== -1
    ) {

      baseRues[
        baseIndex
      ].bal =
        activeEntry.bal;

      baseRues[
        baseIndex
      ].fait =
        activeEntry.fait;

    }

    displayActiveStreet();

    setSaveStatus(
      '✓ ' +
      activeEntry.bal +
      ' BAL enregistrées',
      'ok'
    );

  }
  catch (err) {

    setSaveStatus(
      'Erreur temporaire — réessaie dans un instant',
      'error'
    );

  }
  finally {

    saving =
      false;

    if (
      activeEntry
    ) {

      document
        .getElementById('saveButton')
        .disabled =
          false;

    }

  }

}


/* ==========================
   SEARCH
========================== */

function searchStreet() {

  const input =
    document
      .getElementById('searchInput');

  const container =
    document
      .getElementById('searchResults');

  const query =
    normalizeText(
      input.value
    );

  container.innerHTML =
    '';

  if (
    !query
  ) {

    container.style.display =
      'none';

    return;

  }

  const results =

    baseRues

      .filter(
        item => {

          const rue =
            normalizeText(
              item.rue
            );

          return rue.includes(
            query
          );

        }
      )

      .slice(
        0,
        20
      );

  if (
    results.length === 0
  ) {

    container.innerHTML =
      '<div class="result">Aucune rue trouvée</div>';

    container.style.display =
      'block';

    return;

  }

  results.forEach(
    item => {

      const div =
        document
          .createElement(
            'div'
          );

      div.className =
        'result';

      div.innerHTML =

        '<strong>' +

        escapeHtml(
          item.rue
        ) +

        '</strong>' +

        '<small>' +

        escapeHtml(
          item.jour
        ) +

        ' • n° ' +

        item.ordre +

        ' • ' +

        escapeHtml(
          item.type
        ) +

        ' • ' +

        item.bal +

        ' BAL' +

        '</small>';

      div.onclick =
        () => {

          document
            .getElementById('searchInput')
            .value =
              item.rue;

          container.style.display =
            'none';

          candidateId =
            null;

          candidateCount =
            0;

          activateStreet(
            item.id,
            true
          );

        };

      container
        .appendChild(
          div
        );

    }
  );

  container.style.display =
    'block';

}


/* ==========================
   RETOUR GPS
========================== */

function clearManualSelection() {

  manualMode =
    false;

  candidateId =
    null;

  candidateCount =
    0;

  clearTimeout(
    retryTimer
  );

  document
    .getElementById('searchInput')
    .value =
      '';

  document
    .getElementById('searchResults')
    .style
    .display =
      'none';

  setGlobalStatus(
    baseRues.length +
    ' rues • recherche GPS…',
    'wait'
  );

  /*
    On relance immédiatement à partir
    de la dernière position GPS connue.
  */

  lastGeocodeTime =
    0;

  if (
    lastGpsLat !== null &&
    lastGpsLng !== null
  ) {

    scheduleGeocode(
      true
    );

  }
  else {

    setGlobalStatus(
      baseRues.length +
      ' rues • attente GPS…',
      'wait'
    );

  }

}


/* ==========================
   UTILS
========================== */

function escapeHtml(text) {

  return String(
    text || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* ==========================
   STATUS
========================== */

function setGlobalStatus(
  text,
  type
) {

  const textElement =
    document
      .getElementById('globalStatus');

  const box =
    document
      .getElementById('connection');

  textElement.textContent =
    text;

  box.className =
    'connection ' +
    type;

}


function setSaveStatus(
  text,
  type
) {

  const element =
    document
      .getElementById('saveStatus');

  element.textContent =
    text;

  element.className =
    'status ' +
    type;

}


/* ==========================
   START
========================== */

loadBase();
