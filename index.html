<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Boîtage GPS</title>

  <style>

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f2f2f7;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 5px;
    }

    #status {
      font-size: 14px;
      margin-bottom: 20px;
      color: #666;
      min-height: 20px;
    }

    .rue {
      background: white;
      padding: 22px 15px;
      border-radius: 18px;
      font-size: 25px;
      font-weight: 700;
      min-height: 60px;

      display: flex;
      justify-content: center;
      align-items: center;

      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .bal {
      font-size: 72px;
      font-weight: 800;
      margin: 25px 0 0;
    }

    .label {
      font-size: 20px;
      margin-bottom: 25px;
      color: #555;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 17px;
      padding: 22px 5px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    .minus {
      background: #e5e5ea;
    }

    .plus {
      background: #d1e7ff;
    }

    .plus5 {
      background: #b9ddff;
    }

    .street {
      width: 100%;
      margin-top: 15px;
      background: #ff9500;
      color: white;
      font-size: 18px;
    }

    .sync {
      margin-top: 20px;
      padding: 10px;
      border-radius: 12px;
      background: white;
      font-size: 14px;
    }

    .debug {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
      white-space: pre-line;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>📬 Boîtage GPS</h1>

  <div id="status">
    Initialisation GPS…
  </div>


  <div class="rue" id="rue">
    Recherche de la rue…
  </div>


  <div class="bal" id="bal">
    0
  </div>

  <div class="label">
    boîtes aux lettres
  </div>


  <div class="buttons">

    <button
      class="minus"
      onclick="modifier(-1)"
    >
      −1
    </button>


    <button
      class="plus"
      onclick="modifier(1)"
    >
      +1
    </button>


    <button
      class="plus5"
      onclick="modifier(5)"
    >
      +5
    </button>

  </div>


  <button
    class="street"
    onclick="choisirRue()"
  >
    ✏️ Choisir la rue manuellement
  </button>


  <div
    class="sync"
    id="sync"
  >
    ☁️ En attente de synchronisation
  </div>


  <div
    class="debug"
    id="debug"
  >
  </div>

</div>



<script>

/* ==========================================================
   GOOGLE SHEET
   ========================================================== */


/*
  IMPORTANT :

  Remplace uniquement le texte entre les apostrophes
  ci-dessous par ton URL Apps Script.

  Elle doit terminer par :

  /exec
*/

const API_URL = https://script.google.com/macros/s/AKfycbxhbYmORw_HilfITh6G58wLQ5P89PptlcVcMZm0ur0NJCl0fOp7B7d9f6yvDGhvfdL_BA/exec;



/* ==========================================================
   RUES DU PROTOTYPE
   ========================================================== */

const RUES_TEST = [

  'Chemin Marius Milon',

  'Chemin des Mille Écus',

  'Boulevard Marcel Delestrade'

];



/* ==========================================================
   VARIABLES
   ========================================================== */

let rueActive = '';

let compteurs =
  JSON.parse(
    localStorage.getItem('compteursBoitage') || '{}'
  );

let chargementRue = false;



/* ==========================================================
   STOCKAGE LOCAL
   ========================================================== */

function sauvegarderLocal() {

  localStorage.setItem(
    'compteursBoitage',
    JSON.stringify(compteurs)
  );

}



function afficherCompteur() {

  let bal = 0;

  if (rueActive) {

    bal =
      Number(compteurs[rueActive]) || 0;

  }

  document.getElementById('bal').innerText =
    bal;

}



/* ==========================================================
   SYNCHRONISATION GOOGLE SHEET
   ========================================================== */

async function recupererCompteur(rue) {

  document.getElementById('sync').innerText =
    '☁️ Récupération du compteur…';

  try {

    const url =
      API_URL +
      '?action=getRue&rue=' +
      encodeURIComponent(rue) +
      '&t=' +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        'HTTP ' + response.status
      );

    }


    const data =
      await response.json();


    if (data.ok) {

      compteurs[rue] =
        Number(data.bal) || 0;

      sauvegarderLocal();

      afficherCompteur();


      document.getElementById('sync').innerText =
        '☁️ Google Sheet synchronisé ✓';

    }

    else {

      document.getElementById('sync').innerText =
        '⚠️ Rue absente du Google Sheet';

    }

  }

  catch (error) {

    console.error(error);


    document.getElementById('sync').innerText =
      '⚠️ Impossible de lire le Google Sheet';

  }

}



/* ==========================================================
   ACTIVATION D'UNE RUE
   ========================================================== */

async function activerRue(rue) {

  if (!rue) {

    return;

  }


  /*
    Si nous sommes déjà sur cette rue,
    inutile de recharger le compteur
    toutes les quelques secondes.
  */

  if (rueActive === rue) {

    return;

  }


  rueActive = rue;


  document.getElementById('rue').innerText =
    '📍 ' + rueActive;


  /*
    On affiche immédiatement le compteur
    local pendant que Google Sheet répond.
  */

  if (
    compteurs[rueActive] === undefined
  ) {

    compteurs[rueActive] = 0;

  }


  afficherCompteur();


  /*
    Puis on récupère la vraie valeur
    enregistrée dans Google Sheet.
  */

  await recupererCompteur(rueActive);

}



/* ==========================================================
   MODIFICATION DU NOMBRE DE BAL
   ========================================================== */

async function modifier(nombre) {

  if (!rueActive) {

    alert(
      "Aucune rue détectée."
    );

    return;

  }


  if (
    compteurs[rueActive] === undefined
  ) {

    compteurs[rueActive] = 0;

  }


  compteurs[rueActive] += nombre;


  if (
    compteurs[rueActive] < 0
  ) {

    compteurs[rueActive] = 0;

  }


  sauvegarderLocal();

  afficherCompteur();


  document.getElementById('sync').innerText =
    '☁️ Synchronisation…';


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: 'POST',

          /*
            text/plain évite une requête
            CORS preflight supplémentaire
            avec Apps Script.
          */

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },


          body: JSON.stringify({

            action:
              'updateBAL',

            rue:
              rueActive,

            bal:
              compteurs[rueActive],

            type:
              nombre > 0
                ? '+' + nombre
                : String(nombre)

          })

        }
      );


    if (!response.ok) {

      throw new Error(
        'HTTP ' + response.status
      );

    }


    const data =
      await response.json();


    if (data.ok) {

      document.getElementById('sync').innerText =
        '☁️ Google Sheet synchronisé ✓';

    }

    else {

      throw new Error(
        data.message || 'Erreur API'
      );

    }

  }

  catch (error) {

    console.error(error);


    document.getElementById('sync').innerText =
      '⚠️ BAL sauvegardées sur iPhone - Sheet non synchronisé';

  }

}



/* ==========================================================
   CHOIX MANUEL POUR LES TESTS
   ========================================================== */

function choisirRue() {

  const choix =
    prompt(

      "Choisis une rue :\n\n" +

      "1 = Chemin Marius Milon\n" +

      "2 = Chemin des Mille Écus\n" +

      "3 = Boulevard Marcel Delestrade"

    );


  if (choix === '1') {

    activerRue(
      RUES_TEST[0]
    );

  }


  else if (choix === '2') {

    activerRue(
      RUES_TEST[1]
    );

  }


  else if (choix === '3') {

    activerRue(
      RUES_TEST[2]
    );

  }

}



/* ==========================================================
   REVERSE GEOCODING
   ========================================================== */

async function reverseGeocode(
  lat,
  lng
) {

  try {

    const url =

      'https://nominatim.openstreetmap.org/reverse' +

      '?format=jsonv2' +

      '&lat=' + lat +

      '&lon=' + lng +

      '&zoom=18' +

      '&addressdetails=1';


    const response =
      await fetch(
        url,
        {
          headers: {
            'Accept':
              'application/json'
          }
        }
      );


    const data =
      await response.json();


    const rue =

      data.address?.road ||

      data.address?.pedestrian ||

      data.address?.residential ||

      data.address?.path ||

      '';


    return {

      rue: rue,

      display:
        data.display_name || ''

    };

  }


  catch (error) {

    console.error(error);


    return {

      rue: '',

      display: ''

    };

  }

}



/* ==========================================================
   NORMALISATION DES NOMS
   ========================================================== */

function normaliser(texte) {

  return String(texte || '')

    .toLowerCase()

    .normalize('NFD')

    .replace(
      /[\u0300-\u036f]/g,
      ''
    )

    .replace(
      /[’']/g,
      ' '
    )

    .replace(
      /\s+/g,
      ' '
    )

    .trim();

}



/* ==========================================================
   IDENTIFICATION DE LA RUE
   ========================================================== */

function identifierRue(
  rueGPS
) {

  const gps =
    normaliser(rueGPS);


  if (!gps) {

    return '';

  }


  for (
    const rue of RUES_TEST
  ) {

    const test =
      normaliser(rue);


    if (

      gps === test ||

      gps.includes(test) ||

      test.includes(gps)

    ) {

      return rue;

    }

  }


  return '';

}



/* ==========================================================
   POSITION GPS TROUVÉE
   ========================================================== */

async function positionTrouvee(
  position
) {

  const lat =
    position.coords.latitude;


  const lng =
    position.coords.longitude;


  const precision =
    Math.round(
      position.coords.accuracy
    );


  document.getElementById('status').innerText =

    'GPS actif — précision ±' +

    precision +

    ' m';


  const resultat =
    await reverseGeocode(
      lat,
      lng
    );


  document.getElementById('debug').innerText =

    'GPS : ' +

    lat.toFixed(6) +

    ', ' +

    lng.toFixed(6) +

    '\nRue GPS : ' +

    (
      resultat.rue ||
      'inconnue'
    );


  const rueTrouvee =
    identifierRue(
      resultat.rue
    );


  if (rueTrouvee) {

    await activerRue(
      rueTrouvee
    );

  }

  else {

    /*
      On n'efface PAS rueActive.

      Comme ça, un petit écart GPS,
      un carrefour ou une impasse
      ne fait pas perdre le compteur.
    */

    document.getElementById('rue').innerText =

      rueActive

        ? '📍 ' + rueActive

        : '📍 Hors rue de test';

  }

}



/* ==========================================================
   ERREUR GPS
   ========================================================== */

function erreurGPS(
  error
) {

  document.getElementById('status').innerText =

    'Erreur GPS : ' +

    error.message;

}



/* ==========================================================
   DÉMARRAGE GPS
   ========================================================== */

if (
  'geolocation' in navigator
) {

  navigator.geolocation.watchPosition(

    positionTrouvee,

    erreurGPS,

    {

      enableHighAccuracy:
        true,

      maximumAge:
        2000,

      timeout:
        15000

    }

  );

}

else {

  document.getElementById('status').innerText =

    'GPS non disponible';

}

</script>

</body>

</html>
