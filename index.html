<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Boîtage GPS</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f2f2f7;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
      margin: 25px 0 5px;
    }

    #status {
      font-size: 16px;
      margin-bottom: 20px;
      color: #666;
      min-height: 22px;
    }

    .rue {
      background: white;
      padding: 25px 15px;
      border-radius: 18px;
      font-size: 25px;
      font-weight: 700;
      min-height: 65px;

      display: flex;
      justify-content: center;
      align-items: center;

      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .bal {
      font-size: 76px;
      font-weight: 800;
      margin: 25px 0 0;
    }

    .label {
      font-size: 20px;
      margin-bottom: 25px;
      color: #555;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 17px;
      padding: 22px 5px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(.96);
    }

    .minus {
      background: #e5e5ea;
      color: #007aff;
    }

    .plus {
      background: #cfe6ff;
      color: #007aff;
    }

    .plus5 {
      background: #add7ff;
      color: #007aff;
    }

    .street {
      width: 100%;
      margin-top: 15px;
      background: #ff9500;
      color: white;
      font-size: 18px;
    }

    .sync {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: white;
      font-size: 15px;
    }

    .debug {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
      white-space: pre-line;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📬 Boîtage GPS</h1>

  <div id="status">
    Initialisation GPS…
  </div>

  <div class="rue" id="rue">
    Recherche de la rue…
  </div>

  <div class="bal" id="bal">
    0
  </div>

  <div class="label">
    boîtes aux lettres
  </div>

  <div class="buttons">

    <button
      class="minus"
      id="moins1"
      type="button"
    >
      −1
    </button>

    <button
      class="plus"
      id="plus1"
      type="button"
    >
      +1
    </button>

    <button
      class="plus5"
      id="plus5"
      type="button"
    >
      +5
    </button>

  </div>

  <button
    class="street"
    id="choisirRue"
    type="button"
  >
    ✏️ Choisir la rue manuellement
  </button>

  <div
    class="sync"
    id="sync"
  >
    ☁️ En attente de synchronisation
  </div>

  <div
    class="debug"
    id="debug"
  ></div>

</div>


<script>

/* ==========================================================
   CONFIGURATION
   ========================================================== */

const API_URL = 'https://script.google.com/macros/s/AKfycbxhbYmORw_HilfITh6G58wLQ5P89PptlcVcMZm0ur0NJCl0fOp7B7d9f6yvDGhvfdL_BA/exec';


const RUES_TEST = [
  'Chemin Marius Milon',
  'Chemin des Mille Écus',
  'Boulevard Marcel Delestrade'
];


/* ==========================================================
   VARIABLES
   ========================================================== */

let rueActive = '';

let compteurs = {};

try {
  compteurs =
    JSON.parse(
      localStorage.getItem('compteursBoitage') || '{}'
    );
} catch (e) {
  compteurs = {};
}


/* ==========================================================
   OUTILS
   ========================================================== */

function setStatus(texte) {
  document.getElementById('status').textContent = texte;
}

function setSync(texte) {
  document.getElementById('sync').textContent = texte;
}

function sauvegarderLocal() {
  localStorage.setItem(
    'compteursBoitage',
    JSON.stringify(compteurs)
  );
}

function afficherCompteur() {

  let valeur = 0;

  if (rueActive) {
    valeur = Number(compteurs[rueActive]) || 0;
  }

  document.getElementById('bal').textContent = valeur;
}


/* ==========================================================
   GOOGLE SHEET : LECTURE
   ========================================================== */

async function recupererCompteur(rue) {

  setSync('☁️ Récupération du compteur…');

  try {

    const url =
      API_URL +
      '?action=getRue&rue=' +
      encodeURIComponent(rue) +
      '&t=' +
      Date.now();

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();

    if (data.ok) {

      compteurs[rue] =
        Number(data.bal) || 0;

      sauvegarderLocal();
      afficherCompteur();

      setSync(
        '☁️ Google Sheet synchronisé ✓'
      );

    } else {

      setSync(
        '⚠️ Rue absente du Google Sheet'
      );
    }

  } catch (error) {

    console.error(error);

    setSync(
      '⚠️ Impossible de lire le Google Sheet'
    );
  }
}


/* ==========================================================
   ACTIVATION D'UNE RUE
   ========================================================== */

async function activerRue(rue) {

  if (!rue) {
    return;
  }

  /*
    Si on détecte continuellement la même rue,
    on ne recharge pas le compteur en permanence.
  */

  if (rueActive === rue) {
    return;
  }

  rueActive = rue;

  document.getElementById('rue').textContent =
    '📍 ' + rueActive;

  if (compteurs[rueActive] === undefined) {
    compteurs[rueActive] = 0;
  }

  afficherCompteur();

  await recupererCompteur(rueActive);
}


/* ==========================================================
   MODIFIER BAL
   ========================================================== */

async function modifier(nombre) {

  if (!rueActive) {

    alert(
      'Aucune rue active. Choisis une rue ou attends la détection GPS.'
    );

    return;
  }

  const ancienneValeur =
    Number(compteurs[rueActive]) || 0;

  let nouvelleValeur =
    ancienneValeur + nombre;

  if (nouvelleValeur < 0) {
    nouvelleValeur = 0;
  }

  compteurs[rueActive] =
    nouvelleValeur;

  sauvegarderLocal();
  afficherCompteur();

  setSync(
    '☁️ Synchronisation…'
  );

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body: JSON.stringify({
            action: 'updateBAL',
            rue: rueActive,
            bal: nouvelleValeur,
            type:
              nombre > 0
                ? '+' + nombre
                : String(nombre)
          })
        }
      );

    if (!response.ok) {
      throw new Error(
        'HTTP ' + response.status
      );
    }

    const data =
      await response.json();

    if (data.ok) {

      setSync(
        '☁️ Google Sheet synchronisé ✓'
      );

    } else {

      throw new Error(
        data.message || 'Erreur API'
      );
    }

  } catch (error) {

    console.error(error);

    setSync(
      '⚠️ Sauvegardé sur iPhone — Sheet non synchronisé'
    );
  }
}


/* ==========================================================
   CHOIX MANUEL
   ========================================================== */

function choisirRueManuellement() {

  const choix = prompt(
    'Choisis une rue :\n\n' +
    '1 = Chemin Marius Milon\n' +
    '2 = Chemin des Mille Écus\n' +
    '3 = Boulevard Marcel Delestrade\n\n' +
    'Tape simplement 1, 2 ou 3.'
  );

  if (choix === null) {
    return;
  }

  const valeur =
    String(choix).trim();

  if (valeur === '1') {

    activerRue(
      RUES_TEST[0]
    );

  } else if (valeur === '2') {

    activerRue(
      RUES_TEST[1]
    );

  } else if (valeur === '3') {

    activerRue(
      RUES_TEST[2]
    );

  } else {

    alert(
      'Choix incorrect. Tape 1, 2 ou 3.'
    );
  }
}


/* ==========================================================
   NORMALISATION
   ========================================================== */

function normaliser(texte) {

  return String(texte || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[’']/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}


/* ==========================================================
   IDENTIFICATION RUE
   ========================================================== */

function identifierRue(rueGPS) {

  const gps =
    normaliser(rueGPS);

  if (!gps) {
    return '';
  }

  for (const rue of RUES_TEST) {

    const test =
      normaliser(rue);

    if (
      gps === test ||
      gps.includes(test) ||
      test.includes(gps)
    ) {
      return rue;
    }
  }

  return '';
}


/* ==========================================================
   REVERSE GEOCODING
   ========================================================== */

async function reverseGeocode(lat, lng) {

  try {

    const url =
      'https://nominatim.openstreetmap.org/reverse' +
      '?format=jsonv2' +
      '&lat=' +
      encodeURIComponent(lat) +
      '&lon=' +
      encodeURIComponent(lng) +
      '&zoom=18' +
      '&addressdetails=1';

    const response =
      await fetch(
        url,
        {
          headers: {
            'Accept': 'application/json'
          }
        }
      );

    if (!response.ok) {
      throw new Error(
        'Reverse geocoding HTTP ' +
        response.status
      );
    }

    const data =
      await response.json();

    const adresse =
      data.address || {};

    const rue =
      adresse.road ||
      adresse.pedestrian ||
      adresse.residential ||
      adresse.path ||
      adresse.footway ||
      '';

    return {
      rue: rue,
      display:
        data.display_name || ''
    };

  } catch (error) {

    console.error(error);

    return {
      rue: '',
      display: ''
    };
  }
}


/* ==========================================================
   GPS
   ========================================================== */

async function positionTrouvee(position) {

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;

  const precision =
    Math.round(
      position.coords.accuracy
    );

  setStatus(
    'GPS actif — précision ±' +
    precision +
    ' m'
  );

  const resultat =
    await reverseGeocode(
      lat,
      lng
    );

  document.getElementById('debug').textContent =
    'GPS : ' +
    lat.toFixed(6) +
    ', ' +
    lng.toFixed(6) +
    '\nRue GPS : ' +
    (
      resultat.rue ||
      'inconnue'
    );

  const rueTrouvee =
    identifierRue(
      resultat.rue
    );

  if (rueTrouvee) {

    await activerRue(
      rueTrouvee
    );

  } else {

    if (!rueActive) {

      document.getElementById('rue').textContent =
        '📍 Hors rue de test';
    }
  }
}


function erreurGPS(error) {

  let message =
    error.message ||
    'Erreur inconnue';

  setStatus(
    'Erreur GPS : ' +
    message
  );
}


/* ==========================================================
   BOUTONS
   ========================================================== */

document
  .getElementById('moins1')
  .addEventListener(
    'click',
    function () {
      modifier(-1);
    }
  );

document
  .getElementById('plus1')
  .addEventListener(
    'click',
    function () {
      modifier(1);
    }
  );

document
  .getElementById('plus5')
  .addEventListener(
    'click',
    function () {
      modifier(5);
    }
  );

document
  .getElementById('choisirRue')
  .addEventListener(
    'click',
    choisirRueManuellement
  );


/* ==========================================================
   DÉMARRAGE
   ========================================================== */

/*
  Ce message permet de vérifier immédiatement
  que JavaScript fonctionne.
*/

setSync(
  '☁️ Application prête'
);


if (
  'geolocation' in navigator
) {

  navigator.geolocation.watchPosition(
    positionTrouvee,
    erreurGPS,
    {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 15000
    }
  );

} else {

  setStatus(
    'GPS non disponible sur cet appareil'
  );
}

</script>

</body>
</html>
