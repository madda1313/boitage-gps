<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#F7F4EC">

<title>Immobilière du Golf — Boîtage</title>

<style>

:root {
  --green: #064B2E;
  --green-dark: #033B24;
  --green-soft: #E8EFEA;
  --cream: #F7F4EC;
  --cream-card: #FFFCF6;
  --gold: #B99A5E;
  --border: rgba(6,75,46,.15);
  --muted: #66756D;
  --shadow: 0 12px 35px rgba(20,50,35,.07);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #fffdf8 0,
      var(--cream) 45%,
      #f2eee5 100%
    );

  color: var(--green-dark);
}

.app {
  width: 100%;
  max-width: 620px;
  margin: auto;

  padding:
    env(safe-area-inset-top)
    17px
    calc(35px + env(safe-area-inset-bottom));
}

.brand {
  padding: 25px 10px 28px;
  text-align: center;
}

.logo-box {
  position: relative;
  width: min(360px, 88%);
  margin: auto;
}

.logo-box img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

.brand-rule {
  width: 42px;
  height: 1px;
  margin: 25px auto 13px;
  background: var(--gold);
}

.brand-subtitle {
  margin: 0;
  color: var(--green);
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
}

.connection {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 28px;
  margin-bottom: 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
}

.connection.ok .status-dot {
  background: #48A66D;
}

.connection.error .status-dot {
  background: #C76161;
}

.connection.wait .status-dot {
  background: var(--gold);
}

.card {
  margin-bottom: 15px;
  padding: 21px;
  background: rgba(255,252,246,.92);
  border: 1px solid var(--border);
  border-radius: 17px;
  box-shadow: var(--shadow);
}

.section-title {
  margin-bottom: 11px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
}

.street-card {
  position: relative;
  overflow: hidden;
}

.street-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;

  background:
    linear-gradient(
      90deg,
      var(--green),
      var(--gold),
      var(--green)
    );
}

.street-name {
  margin-top: 3px;
  color: var(--green-dark);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 29px;
  font-weight: 500;
  line-height: 1.12;
}

.street-meta {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}

.tag {
  display: inline-flex;
  align-items: center;
  margin-top: 12px;
  padding: 6px 10px;
  border-radius: 30px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

.tag.oui {
  background: #E7F2EA;
  color: #327149;
}

.tag.non {
  background: #F4E9E5;
  color: #985C4A;
}

.current-container {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  text-align: center;
}

.current-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.current-number {
  margin-top: 4px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: var(--green);
  font-size: 57px;
  font-weight: 500;
  line-height: 1;
}

.current-unit {
  margin-top: 4px;
  color: var(--gold);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

input {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #FFFFFF;
  color: var(--green-dark);
  outline: none;
  font-size: 17px;

  transition:
    border .2s,
    box-shadow .2s,
    background .2s;
}

input:focus {
  border-color: rgba(6,75,46,.55);
  box-shadow: 0 0 0 4px rgba(6,75,46,.07);
}

input::placeholder {
  color: #A7AFA9;
}

.bal-input {
  height: 79px;
  padding: 6px 12px;
  text-align: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 42px;
  color: var(--green);
  background: #FFFEFB;
}

button {
  width: 100%;
  border: 0;
  outline: 0;
  cursor: pointer;
  font-family: inherit;
}

.primary {
  height: 57px;
  margin-top: 12px;
  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      var(--green),
      var(--green-dark)
    );

  color: #FFFDF7;
  box-shadow: 0 9px 22px rgba(4,61,37,.17);

  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.primary:active {
  transform: scale(.985);
}

.primary:disabled {
  opacity: .45;
  box-shadow: none;
}

.secondary {
  height: 48px;
  margin-top: 12px;
  border-radius: 12px;
  background: var(--green-soft);
  color: var(--green);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .4px;
}

.search-wrapper {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  pointer-events: none;
}

#searchInput {
  height: 56px;
  padding: 0 15px 0 44px;
}

.search-results {
  display: none;
  max-height: 330px;
  margin-top: 7px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
  box-shadow: 0 12px 30px rgba(20,45,32,.1);
}

.result {
  padding: 13px 14px;
  border-bottom: 1px solid rgba(6,75,46,.08);
}

.result:last-child {
  border-bottom: 0;
}

.result:active {
  background: var(--green-soft);
}

.result strong {
  display: block;
  color: var(--green-dark);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 16px;
  font-weight: 500;
}

.result small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.status {
  margin-top: 11px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
}

.status.ok {
  color: #327149;
}

.status.wait {
  color: #9D7B3F;
}

.status.error {
  color: #A85858;
}

details {
  margin-top: 20px;
  border-top: 1px solid rgba(6,75,46,.1);
  color: var(--muted);
}

summary {
  padding: 18px 2px 8px;
  cursor: pointer;
  list-style: none;
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

summary::-webkit-details-marker {
  display: none;
}

.gps-box {
  padding: 13px 5px;
  font-size: 11px;
  line-height: 1.8;
}

.footer {
  padding: 15px 0 25px;
  text-align: center;
  color: rgba(6,75,46,.45);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 11px;
}

@media (max-width: 430px) {

  .app {
    padding-left: 13px;
    padding-right: 13px;
  }

  .brand {
    padding-top: 17px;
    padding-bottom: 21px;
  }

  .street-name {
    font-size: 27px;
  }

  .card {
    padding: 18px;
  }
}

</style>

<body>

<div class="app">

  <header class="brand">

    <div class="logo-box">

    </div>

    <div class="brand-rule"></div>

    <p class="brand-subtitle">
      Suivi de prospection
    </p>

  </header>


  <div
    id="connection"
    class="connection"
  >
    <span class="status-dot"></span>

    </span>
  </div>


  <section class="card street-card">

    <div class="section-title">

    </div>

    </div>

    </div>

    <div id="faitTag"></div>


    <div class="current-container">

      <div class="current-label">

      <div>

      <div>

        <span id="rawStreet">—</span>

        <span id="syncInfo">—</span>

    </div>

  </details>


  <footer class="footer">

<script>

/* ==========================================================
   CONFIGURATION
========================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbyIGyX1UivU6zgNL3nvzxqBKaW4c_MLSVWCzk9fgzxgX6XZLEDfvuau7mKPM0phVS4Y/exec';


/*
  Synchronisation complète avec Google Sheets.
*/
const FULL_SYNC_INTERVAL = 5 * 60 * 1000;


/*
  GPS / Nominatim.
*/
const GEOCODE_INTERVAL = 5000;
const GEOCODE_STALE_INTERVAL = 10000;
const GEOCODE_MIN_DISTANCE = 8;
const GEOCODE_RETRY_DELAY = 1800;
const REQUIRED_CONFIRMATIONS = 2;


/*
  Apps Script.
*/
const API_TIMEOUT = 12000;
const API_RETRIES = 2;
const API_RETRY_DELAY = 900;


/*
  Stockage local.
*/
const BASE_CACHE_KEY =
'allauch_base_rues_v5';

const BASE_CACHE_TIME_KEY =
'allauch_base_rues_v5_time';

const PENDING_WRITES_KEY =
'allauch_pending_writes_v5';


/* ==========================================================
   VARIABLES
========================================================== */

let baseRues = [];

let activeEntry = null;

let manualMode = false;

let gpsWatchId = null;


/*
  GPS.
*/
let lastGpsLat = null;
let lastGpsLng = null;

let lastGeocodeLat = null;
let lastGeocodeLng = null;

let lastGeocodeAttemptTime = 0;
let lastGeocodeSuccessTime = 0;

let geocodeRunning = false;
let geocodePending = false;
let retryTimer = null;


/*
  Détection rue.
*/
let candidateId = null;
let candidateCount = 0;


/*
  Synchronisation Google.
*/
let fullSyncRunning = false;
let pendingFlushRunning = false;

let syncTimer = null;

let saving = false;


/* ==========================================================
   NORMALISATION
========================================================== */

function normalizeText(text) {

  return String(text || '')

    .normalize('NFD')

    .replace(
      /[\u0300-\u036f]/g,
      ''
    )

    .toLowerCase()

    .replace(
      /[’']/g,
      ' '
    )

    .replace(
      /[-_/]/g,
      ' '
    )

    .replace(
      /\b(chemin|chem|ch|impasse|imp|avenue|av|boulevard|bd|route|rue|allee|allée|lotissement|lot|traverse|montée|montee|place|cours)\b/g,
      ' '
    )

    .replace(
      /\s+/g,
      ' '
    )

    .trim();
}


/* ==========================================================
   ATTENTE
========================================================== */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


/* ==========================================================
   JSONP
========================================================== */

function jsonpOnce(
  params,
  timeoutMs = API_TIMEOUT
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() *
          1000000
        );


      const query =
        new URLSearchParams({

          ...params,

          callback:
            callbackName,

          _ts:
            Date.now()

        }).toString();


      const script =
        document
          .createElement(
            'script'
          );


      let finished =
        false;


      const timeout =
        setTimeout(
          () => {

            if (
              finished
            ) {
              return;
            }

            finished =
              true;

            cleanup();

            reject(
              new Error(
                'Délai dépassé'
              )
            );

          },
          timeoutMs
        );


      function cleanup() {

        clearTimeout(
          timeout
        );

        if (
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );

        }

        try {

          delete window[
            callbackName
          ];

        }

        catch(e) {

          window[
            callbackName
          ] = undefined;

        }

      }


      window[
        callbackName
      ] =
        function(data) {

          if (
            finished
          ) {
            return;
          }

          finished =
            true;

          cleanup();

          resolve(
            data
          );

        };


      script.onerror =
        function() {

          if (
            finished
          ) {
            return;
          }

          finished =
            true;

          cleanup();

          reject(
            new Error(
              'Erreur réseau'
            )
          );

        };


      script.async =
        true;


      script.src =
        API_URL +
        '?' +
        query;


      document.head
        .appendChild(
          script
        );

    }
  );
}


/* ==========================================================
   JSONP AVEC RETRY
========================================================== */

async function jsonp(
  params,
  options = {}
) {

  const retries =
    options.retries ??
    API_RETRIES;


  const timeout =
    options.timeout ??
    API_TIMEOUT;


  let lastError =
    null;


  for (
    let attempt = 0;
    attempt <= retries;
    attempt++
  ) {

    try {

      const data =
        await jsonpOnce(
          params,
          timeout
        );


      if (
        !data ||
        data.ok === false
      ) {

        throw new Error(
          data?.message ||
          'Réponse API invalide'
        );

      }


      return data;

    }

    catch(err) {

      lastError =
        err;


      if (
        attempt <
        retries
      ) {

        await sleep(

          API_RETRY_DELAY *

          (
            attempt +
            1
          )

        );

      }

    }

  }


  throw (
    lastError ||
    new Error(
      'Connexion impossible'
    )
  );
}


/* ==========================================================
   CACHE BASE
========================================================== */

function saveBaseCache() {

  try {

    localStorage.setItem(

      BASE_CACHE_KEY,

      JSON.stringify(
        baseRues
      )

    );


    localStorage.setItem(

      BASE_CACHE_TIME_KEY,

      String(
        Date.now()
      )

    );

  }

  catch(e) {

    console.warn(
      'Cache impossible',
      e
    );

  }

}


function loadBaseCache() {

  try {

    const raw =
      localStorage.getItem(
        BASE_CACHE_KEY
      );


    if (
      !raw
    ) {

      return false;

    }


    const cached =
      JSON.parse(
        raw
      );


    if (
      !Array.isArray(
        cached
      )
      ||
      cached.length === 0
    ) {

      return false;

    }


    baseRues =
      cached;


    return true;

  }

  catch(e) {

    return false;

  }

}


/* ==========================================================
   MODIFICATIONS EN ATTENTE
========================================================== */

function getPendingWrites() {

  try {

    const raw =
      localStorage.getItem(
        PENDING_WRITES_KEY
      );


    if (
      !raw
    ) {

      return {};

    }


    const parsed =
      JSON.parse(
        raw
      );


    if (
      !parsed ||
      typeof parsed !==
      'object'
    ) {

      return {};

    }


    return parsed;

  }

  catch(e) {

    return {};

  }

}


function savePendingWrites(
  pending
) {

  try {

    localStorage.setItem(

      PENDING_WRITES_KEY,

      JSON.stringify(
        pending
      )

    );

  }

  catch(e) {

    console.warn(
      'File locale impossible',
      e
    );

  }

}


function queueBALWrite(
  id,
  bal
) {

  const pending =
    getPendingWrites();


  pending[
    String(id)
  ] = {

    id:
      String(id),

    bal:
      Number(bal),

    updatedAt:
      Date.now()

  };


  savePendingWrites(
    pending
  );

}


/* ==========================================================
   MISE À JOUR D'UNE RUE LOCALE
========================================================== */

function updateLocalStreet(
  id,
  bal,
  fait
) {

  const index =
    baseRues.findIndex(

      item =>
        String(
          item.id
        )
        ===
        String(
          id
        )

    );


  if (
    index === -1
  ) {

    return;

  }


  baseRues[
    index
  ].bal =
    Number(bal) || 0;


  if (
    fait
  ) {

    baseRues[
      index
    ].fait =
      fait;

  }


  if (
    activeEntry &&
    String(
      activeEntry.id
    )
    ===
    String(
      id
    )
  ) {

    activeEntry.bal =
      Number(bal) || 0;


    if (
      fait
    ) {

      activeEntry.fait =
        fait;

    }


    displayActiveStreet();

  }

}


/* ==========================================================
   ENVOI DES MODIFICATIONS EN ATTENTE
========================================================== */

async function flushPendingWrites() {

  if (
    pendingFlushRunning
  ) {

    return;

  }


  if (
    !navigator.onLine
  ) {

    return;

  }


  const pending =
    getPendingWrites();


  const entries =
    Object.values(
      pending
    );


  if (
    entries.length === 0
  ) {

    return;

  }


  pendingFlushRunning =
    true;


  try {

    /*
      On envoie les modifications une par une.

      Important :
      si la même rue a été modifiée plusieurs fois,
      la file ne garde déjà que la dernière valeur.
    */

    for (
      const entry
      of entries
    ) {

      /*
        Vérifie que cette version de l'écriture
        est toujours la plus récente.
      */

      const currentPending =
        getPendingWrites();


      const latest =
        currentPending[
          String(
            entry.id
          )
        ];


      if (
        !latest ||
        latest.updatedAt !==
        entry.updatedAt
      ) {

        continue;

      }


      try {

        const result =
          await jsonp(

            {
              action:
                'updateBAL',

              id:
                entry.id,

              bal:
                entry.bal
            },

            {
              retries:
                2,

              timeout:
                12000
            }

          );


        /*
          On vérifie encore que personne n'a modifié
          cette rue localement pendant l'appel réseau.
        */

        const afterCall =
          getPendingWrites();


        const current =
          afterCall[
            String(
              entry.id
            )
          ];


        if (
          current &&
          current.updatedAt ===
          entry.updatedAt
        ) {

          delete afterCall[
            String(
              entry.id
            )
          ];


          savePendingWrites(
            afterCall
          );


          updateLocalStreet(

            entry.id,

            result.bal !== undefined
              ? result.bal
              : entry.bal,

            result.fait
              ||
              (
                entry.bal > 0
                  ? 'Oui'
                  : undefined
              )

          );

        }

      }

      catch(err) {

        /*
          On ne supprime rien.
          L'écriture reste stockée pour plus tard.
        */

        console.warn(
          'Écriture conservée en attente :',
          entry.id,
          err
        );

      }

    }


    saveBaseCache();

  }

  finally {

    pendingFlushRunning =
      false;

  }

}


/* ==========================================================
   FUSION GOOGLE -> CACHE LOCAL
========================================================== */

function mergeRemoteBase(
  remoteRues
) {

  const pending =
    getPendingWrites();


  const localMap =
    new Map();


  baseRues.forEach(
    item => {

      localMap.set(
        String(
          item.id
        ),
        item
      );

    }
  );


  const merged = [];


  remoteRues.forEach(
    remote => {

      const id =
        String(
          remote.id
        );


      /*
        Une modification locale non encore envoyée
        est prioritaire temporairement.
      */

      if (
        pending[
          id
        ]
      ) {

        const local =
          localMap.get(
            id
          );


        if (
          local
        ) {

          merged.push({
            ...remote,
            bal:
              local.bal,
            fait:
              local.fait
          });

        }

        else {

          merged.push(
            remote
          );

        }

      }

      else {

        merged.push(
          remote
        );

      }

    }
  );


  baseRues =
    merged;


  /*
    Si la rue affichée est présente dans
    la nouvelle base, on rafraîchit l'écran.
  */

  if (
    activeEntry
  ) {

    const fresh =
      baseRues.find(

        item =>
          String(
            item.id
          )
          ===
          String(
            activeEntry.id
          )

      );


    if (
      fresh
    ) {

      activeEntry = {
        ...fresh
      };


      displayActiveStreet();

    }

  }


  saveBaseCache();

}


/* ==========================================================
   SYNCHRONISATION COMPLÈTE
========================================================== */

async function fullSync(
  showStatus = false
) {

  if (
    fullSyncRunning
  ) {

    return;

  }


  if (
    !navigator.onLine
  ) {

    return;

  }


  fullSyncRunning =
    true;


  try {

    /*
      D'abord on essaie d'envoyer ce qui est en attente.
    */

    await flushPendingWrites();


    if (
      showStatus
    ) {

      setGlobalStatus(

        baseRues.length
          ? baseRues.length +
            ' rues • synchronisation…'
          : 'Synchronisation…',

        'wait'

      );

    }


    const data =
      await jsonp(

        {
          action:
            'liste'
        },

        {
          retries:
            2,

          timeout:
            12000
        }

      );


    const remoteRues =
      data.rues || [];


    if (
      remoteRues.length > 0
    ) {

      mergeRemoteBase(
        remoteRues
      );

    }


    document
      .getElementById(
        'syncInfo'
      )
      .textContent =
        new Date()
          .toLocaleTimeString(
            'fr-FR',
            {
              hour:
                '2-digit',

              minute:
                '2-digit'
            }
          );


    setGlobalStatus(

      baseRues.length +
      ' rues • GPS actif',

      'ok'

    );

  }

  catch(err) {

    console.warn(
      'Synchronisation Google impossible',
      err
    );


    /*
      Pas de gros message d'erreur.
      L'application continue avec sa base locale.
    */

    if (
      baseRues.length
    ) {

      setGlobalStatus(

        baseRues.length +
        ' rues • mode local',

        'wait'

      );

    }

    else {

      setGlobalStatus(

        'Connexion Google indisponible',

        'error'

      );

    }

  }

  finally {

    fullSyncRunning =
      false;

  }

}


/* ==========================================================
   DÉMARRAGE BASE
========================================================== */

async function loadBase() {

  const hasCache =
    loadBaseCache();


  if (
    hasCache
  ) {

    setGlobalStatus(

      baseRues.length +
      ' rues • GPS actif',

      'ok'

    );


    startGPS();

  }

  else {

    setGlobalStatus(
      'Chargement des rues…',
      'wait'
    );

  }


  /*
    La synchronisation Google démarre en arrière-plan.
  */

  await fullSync(
    !hasCache
  );


  if (
    gpsWatchId === null &&
    baseRues.length
  ) {

    startGPS();

  }


  startPeriodicSync();

}


/* ==========================================================
   SYNCHRO TOUTES LES 5 MIN
========================================================== */

function startPeriodicSync() {

  if (
    syncTimer
  ) {

    clearInterval(
      syncTimer
    );

  }


  syncTimer =
    setInterval(
      () => {

        fullSync(
          false
        );

      },
      FULL_SYNC_INTERVAL
    );

}


/* ==========================================================
   GPS
========================================================== */

function startGPS() {

  if (
    gpsWatchId !== null
  ) {

    return;

  }


  if (
    !navigator.geolocation
  ) {

    setGlobalStatus(
      'GPS indisponible',
      'error'
    );

    return;

  }


  gpsWatchId =
    navigator
      .geolocation
      .watchPosition(

        onPosition,

        onGpsError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2500,

          timeout:
            15000

        }

      );

}


/* ==========================================================
   NOUVELLE POSITION
========================================================== */

function onPosition(
  position
) {

  const lat =
    position
      .coords
      .latitude;


  const lng =
    position
      .coords
      .longitude;


  const accuracy =
    position
      .coords
      .accuracy;


  lastGpsLat =
    lat;


  lastGpsLng =
    lng;


  document
    .getElementById(
      'lat'
    )
    .textContent =
      lat.toFixed(
        6
      );


  document
    .getElementById(
      'lng'
    )
    .textContent =
      lng.toFixed(
        6
      );


  document
    .getElementById(
      'accuracy'
    )
    .textContent =
      '± ' +
      Math.round(
        accuracy
      ) +
      ' m';


  if (
    manualMode
  ) {

    return;

  }


  scheduleGeocode(
    false
  );

}


/* ==========================================================
   ERREUR GPS
========================================================== */

function onGpsError(
  error
) {

  let message =
    'Erreur GPS';


  if (
    error.code === 1
  ) {

    message =
      'Autorisation GPS refusée';

  }

  else if (
    error.code === 2
  ) {

    message =
      'Position GPS indisponible';

  }

  else if (
    error.code === 3
  ) {

    message =
      'Recherche GPS…';

  }


  setGlobalStatus(

    message,

    error.code === 3
      ? 'wait'
      : 'error'

  );

}


/* ==========================================================
   PLANIFICATION GÉOCODAGE
========================================================== */

function scheduleGeocode(
  force = false
) {

  if (
    manualMode
  ) {

    return;

  }


  if (
    lastGpsLat === null ||
    lastGpsLng === null
  ) {

    return;

  }


  const now =
    Date.now();


  /*
    IMPORTANT :
    même si l'utilisateur roule vite,
    aucune requête normale ne part avant
    GEOCODE_INTERVAL.
  */

  if (
    !force &&
    now -
    lastGeocodeAttemptTime <
    GEOCODE_INTERVAL
  ) {

    return;

  }


  let movedEnough =
    true;


  if (
    lastGeocodeLat !== null &&
    lastGeocodeLng !== null
  ) {

    const moved =
      distanceMeters(

        lastGeocodeLat,
        lastGeocodeLng,

        lastGpsLat,
        lastGpsLng

      );


    movedEnough =
      moved >=
      GEOCODE_MIN_DISTANCE;

  }


  const stale =
    now -
    lastGeocodeSuccessTime >=
    GEOCODE_STALE_INTERVAL;


  /*
    Il faut :
    - avoir bougé suffisamment
    OU
    - ne pas avoir eu de géocodage depuis longtemps.

    Cela permet aussi d'obtenir la deuxième confirmation
    même lorsqu'on reste presque immobile.
  */

  if (
    !force &&
    !movedEnough &&
    !stale
  ) {

    return;

  }


  if (
    geocodeRunning
  ) {

    geocodePending =
      true;

    return;

  }


  runGeocode(

    lastGpsLat,

    lastGpsLng,

    false

  );

}


/* ==========================================================
   DISTANCE
========================================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;


  const toRad =
    value =>
      value *
      Math.PI /
      180;


  const dLat =
    toRad(
      lat2 -
      lat1
    );


  const dLon =
    toRad(
      lon2 -
      lon1
    );


  const a =

    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(
      toRad(
        lat1
      )
    )

    *

    Math.cos(
      toRad(
        lat2
      )
    )

    *

    Math.sin(
      dLon / 2
    ) ** 2;


  return (

    2 *
    R *
    Math.atan2(

      Math.sqrt(
        a
      ),

      Math.sqrt(
        1 -
        a
      )

    )

  );

}


/* ==========================================================
   NOMINATIM
========================================================== */

async function runGeocode(
  lat,
  lng,
  isRetry
) {

  if (
    geocodeRunning
  ) {

    geocodePending =
      true;

    return;

  }


  geocodeRunning =
    true;


  geocodePending =
    false;


  lastGeocodeAttemptTime =
    Date.now();


  setGlobalStatus(

    baseRues.length +
    ' rues • recherche GPS…',

    'wait'

  );


  let abortTimer =
    null;


  try {

    const controller =
      new AbortController();


    abortTimer =
      setTimeout(

        () =>
          controller.abort(),

        8000

      );


    const url =

      'https://nominatim.openstreetmap.org/reverse'

      +

      '?format=jsonv2'

      +

      '&lat=' +
      encodeURIComponent(
        lat
      )

      +

      '&lon=' +
      encodeURIComponent(
        lng
      )

      +

      '&zoom=18'

      +

      '&addressdetails=1';


    const response =
      await fetch(

        url,

        {

          headers: {

            'Accept-Language':
              'fr'

          },

          signal:
            controller.signal,

          cache:
            'no-store'

        }

      );


    if (
      abortTimer
    ) {

      clearTimeout(
        abortTimer
      );

    }


    if (
      !response.ok
    ) {

      throw new Error(
        'Géocodage indisponible'
      );

    }


    const data =
      await response.json();


    const address =
      data.address || {};


    const rawStreet =

      address.road

      ||

      address.pedestrian

      ||

      address.residential

      ||

      address.path

      ||

      address.neighbourhood

      ||

      '';


    document
      .getElementById(
        'rawStreet'
      )
      .textContent =

        rawStreet ||
        'Non reconnue';


    lastGeocodeSuccessTime =
      Date.now();


    lastGeocodeLat =
      lat;


    lastGeocodeLng =
      lng;


    setGlobalStatus(

      baseRues.length +
      ' rues • GPS actif',

      'ok'

    );


    if (
      rawStreet
    ) {

      detectStreet(
        rawStreet
      );

    }

  }

  catch(err) {

    if (
      abortTimer
    ) {

      clearTimeout(
        abortTimer
      );

    }


    console.log(
      'Erreur géocodage',
      err
    );


    /*
      Une seule nouvelle tentative.
    */

    if (
      !isRetry &&
      !manualMode
    ) {

      clearTimeout(
        retryTimer
      );


      retryTimer =
        setTimeout(
          () => {

            if (
              !manualMode &&
              lastGpsLat !== null &&
              lastGpsLng !== null
            ) {

              runGeocode(

                lastGpsLat,

                lastGpsLng,

                true

              );

            }

          },
          GEOCODE_RETRY_DELAY
        );

    }

    else {

      setGlobalStatus(

        baseRues.length +
        ' rues • GPS actif',

        'ok'

      );

    }

  }

  finally {

    geocodeRunning =
      false;


    if (
      geocodePending &&
      !manualMode
    ) {

      geocodePending =
        false;


      setTimeout(
        () => {

          scheduleGeocode(
            false
          );

        },
        500
      );

    }

  }

}


/* ==========================================================
   DÉTECTION DE RUE
========================================================== */

function detectStreet(
  rawStreet
) {

  if (
    manualMode
  ) {

    return;

  }


  const match =
    findBestMatch(
      rawStreet
    );


  if (
    !match
  ) {

    candidateId =
      null;

    candidateCount =
      0;

    return;

  }


  /*
    Rue déjà active.
  */

  if (
    activeEntry &&
    String(
      activeEntry.id
    )
    ===
    String(
      match.id
    )
  ) {

    candidateId =
      String(
        match.id
      );

    candidateCount =
      REQUIRED_CONFIRMATIONS;

    return;

  }


  /*
    Deux confirmations avant changement automatique.
  */

  if (
    String(
      candidateId
    )
    ===
    String(
      match.id
    )
  ) {

    candidateCount++;

  }

  else {

    candidateId =
      String(
        match.id
      );

    candidateCount =
      1;

  }


  if (
    candidateCount >=
    REQUIRED_CONFIRMATIONS
  ) {

    candidateCount =
      REQUIRED_CONFIRMATIONS;


    activateStreet(

      match.id,

      false

    );

  }

}


/* ==========================================================
   CORRESPONDANCE NOM RUE
========================================================== */

function findBestMatch(
  rawStreet
) {

  const raw =
    normalizeText(
      rawStreet
    );


  if (
    !raw
  ) {

    return null;

  }


  let best =
    null;


  let bestScore =
    0;


  for (
    const item
    of baseRues
  ) {

    const street =
      normalizeText(
        item.rue
      );


    if (
      !street
    ) {

      continue;

    }


    let score =
      0;


    if (
      street ===
      raw
    ) {

      score =
        100;

    }

    else if (

      street.includes(
        raw
      )

      ||

      raw.includes(
        street
      )

    ) {

      score =
        85;

    }

    else {

      const rawWords =
        raw.split(
          ' '
        );


      const streetWords =
        street.split(
          ' '
        );


      const common =
        rawWords.filter(

          word =>
            word.length >= 3
            &&
            streetWords.includes(
              word
            )

        );


      if (
        common.length >= 2
      ) {

        score =
          50 +
          common.length *
          10;

      }

    }


    if (
      score >
      bestScore
    ) {

      bestScore =
        score;


      best =
        item;

    }

  }


  if (
    bestScore < 60
  ) {

    return null;

  }


  return best;

}


/* ==========================================================
   ACTIVER UNE RUE
   100 % LOCAL
========================================================== */

function activateStreet(
  id,
  fromManual
) {

  const item =
    baseRues.find(

      entry =>
        String(
          entry.id
        )
        ===
        String(
          id
        )

    );


  if (
    !item
  ) {

    setSaveStatus(
      'Rue introuvable dans la base locale',
      'error'
    );

    return;

  }


  activeEntry = {
    ...item
  };


  if (
    fromManual
  ) {

    manualMode =
      true;

  }


  displayActiveStreet();


  setSaveStatus(
    '',
    ''
  );

}

  ) {

}


/* ==========================================================
   ENREGISTREMENT BAL
   LOCAL IMMÉDIAT + GOOGLE EN ARRIÈRE-PLAN
========================================================== */

async function saveBAL() {

  if (
    !activeEntry ||
    saving
  ) {

    return;

  }


  const input =
    document
      .getElementById(
        'balInput'
      );


  const bal =
    Number(
      input.value
    );


  if (
    !Number.isFinite(
      bal
    )
    ||
    bal < 0
    ||
    !Number.isInteger(
      bal
    )
  ) {

    setSaveStatus(
      'Entre un nombre valide.',
      'error'
    );

    return;

  }


  saving =
    true;


  document
    .getElementById(
      'saveButton'
    )
    .disabled =
      true;


  const currentId =
    activeEntry.id;


  /*
    1.
    Mise à jour locale IMMÉDIATE.
  */

  const fait =
    bal > 0
      ? 'Oui'
      : activeEntry.fait;


  updateLocalStreet(

    currentId,

    bal,

    fait

  );


  saveBaseCache();


  /*
    2.
    Stockage de l'écriture dans la file locale.
  */

  queueBALWrite(

    currentId,

    bal

  );


  displayActiveStreet();


  setSaveStatus(

    '✓ ' +
    bal +
    ' BAL enregistrées',

    'ok'

  );


  saving =
    false;


  document
    .getElementById(
      'saveButton'
    )
    .disabled =
      false;


  /*
    3.
    Google est contacté en arrière-plan.
    L'utilisateur n'attend pas.
  */

  flushPendingWrites()
    .catch(
      err => {

        console.warn(
          'Synchro différée',
          err
        );

      }
    );

}


/* ==========================================================
   RECHERCHE MANUELLE
========================================================== */

function searchStreet() {

  const input =
    document
      .getElementById(
        'searchInput'
      );


  const container =
    document
      .getElementById(
        'searchResults'
      );


  const query =
    normalizeText(
      input.value
    );


  container.innerHTML =
    '';


  if (
    !query
  ) {

    container.style.display =
      'none';

    return;

  }


  const results =
    baseRues

      .filter(
        item => {

          const rue =
            normalizeText(
              item.rue
            );


          return rue.includes(
            query
          );

        }
      )

      .slice(
        0,
        20
      );


  if (
    results.length === 0
  ) {

    container.innerHTML =
      '<div class="result">Aucune rue trouvée</div>';


    container.style.display =
      'block';


    return;

  }


  results.forEach(
    item => {


      const div =
        document
          .createElement(
            'div'
          );


      div.className =
        'result';


      div.innerHTML =

        '<strong>'

        +

        escapeHtml(
          item.rue
        )

        +

        '</strong>'

        +

        '<small>'

        +

        escapeHtml(
          item.jour
        )

        +

        ' • n° '

        +

        item.ordre

        +

        ' • '

        +

        escapeHtml(
          item.type
        )

        +

        ' • '

        +

        item.bal

        +

        ' BAL'

        +

        '</small>';


      div.onclick =
        () => {


          document
            .getElementById(
              'searchInput'
            )
            .value =
              item.rue;


          container.style.display =
            'none';


          candidateId =
            null;


          candidateCount =
            0;


          activateStreet(

            item.id,

            true

          );

        };


      container
        .appendChild(
          div
        );

    }
  );


  container.style.display =
    'block';

}

/* ==========================================================
   PROTECTION HTML
========================================================== */

function escapeHtml(text) {

  return String(
    text || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/* ==========================================================
   STATUT GLOBAL
========================================================== */

function setGlobalStatus(
  text,
  type
) {

  const textElement =
    document
      .getElementById(
        'globalStatus'
      );


  const box =
    document
      .getElementById(
        'connection'
      );


  textElement.textContent =
    text;


  box.className =
    'connection ' +
    type;

}


/* ==========================================================
   STATUT ENREGISTREMENT
========================================================== */

function setSaveStatus(
  text,
  type
) {

  const element =
    document
      .getElementById(
        'saveStatus'
      );


  element.textContent =
    text;


  element.className =
    'status ' +
    type;

}


/* ==========================================================
   DÉMARRAGE
========================================================== */

loadBase();

</script>
