<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#F7F4EC">

<title>Immobilière du Golf — Boîtage</title>

<style>

:root {
  --green: #064B2E;
  --green-dark: #033B24;
  --green-soft: #E8EFEA;
  --cream: #F7F4EC;
  --cream-card: #FFFCF6;
  --gold: #B99A5E;
  --border: rgba(6,75,46,.15);
  --muted: #66756D;
  --shadow: 0 12px 35px rgba(20,50,35,.07);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #fffdf8 0,
      var(--cream) 45%,
      #f2eee5 100%
    );

  color: var(--green-dark);
}

.app {
  width: 100%;
  max-width: 620px;
  margin: auto;

  padding:
    env(safe-area-inset-top)
    17px
    calc(35px + env(safe-area-inset-bottom));
}

.brand {
  padding: 25px 10px 28px;
  text-align: center;
}

.logo-box {
  position: relative;
  width: min(360px, 88%);
  margin: auto;
}

.logo-box img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

.brand-rule {
  width: 42px;
  height: 1px;
  margin: 25px auto 13px;
  background: var(--gold);
}

.brand-subtitle {
  margin: 0;
  color: var(--green);
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
}

.connection {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 28px;
  margin-bottom: 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
}

.connection.ok .status-dot {
  background: #48A66D;
}

.connection.error .status-dot {
  background: #C76161;
}

.connection.wait .status-dot {
  background: var(--gold);
}

.card {
  margin-bottom: 15px;
  padding: 21px;
  background: rgba(255,252,246,.92);
  border: 1px solid var(--border);
  border-radius: 17px;
  box-shadow: var(--shadow);
}

.section-title {
  margin-bottom: 11px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
}

/* ==========================================================
   RECHERCHE
========================================================== */

.search-wrapper {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  pointer-events: none;
}

#searchInput {
  height: 56px;
  padding: 0 15px 0 44px;
}

.search-results {
  display: none;
  max-height: 330px;
  margin-top: 7px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
  box-shadow: 0 12px 30px rgba(20,45,32,.1);
}

.result {
  padding: 13px 14px;
  border-bottom: 1px solid rgba(6,75,46,.08);
  cursor: pointer;
}

.result:last-child {
  border-bottom: 0;
}

.result:active {
  background: var(--green-soft);
}

.result strong {
  display: block;
  color: var(--green-dark);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 16px;
  font-weight: 500;
}

.result small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

/* ==========================================================
   RUE ACTIVE
========================================================== */

.street-card {
  position: relative;
  overflow: hidden;
}

.street-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;

  background:
    linear-gradient(
      90deg,
      var(--green),
      var(--gold),
      var(--green)
    );
}

.street-name {
  margin-top: 3px;
  color: var(--green-dark);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 29px;
  font-weight: 500;
  line-height: 1.12;
}

.street-meta {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}

.tag {
  display: inline-flex;
  align-items: center;
  margin-top: 12px;
  padding: 6px 10px;
  border-radius: 30px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

.tag.oui {
  background: #E7F2EA;
  color: #327149;
}

.tag.non {
  background: #F4E9E5;
  color: #985C4A;
}

.current-container {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  text-align: center;
}

.current-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.current-number {
  margin-top: 4px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: var(--green);
  font-size: 57px;
  font-weight: 500;
  line-height: 1;
}

.current-unit {
  margin-top: 4px;
  color: var(--gold);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* ==========================================================
   FORMULAIRES
========================================================== */

input {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #FFFFFF;
  color: var(--green-dark);
  outline: none;
  font-size: 17px;

  transition:
    border .2s,
    box-shadow .2s,
    background .2s;
}

input:focus {
  border-color: rgba(6,75,46,.55);
  box-shadow: 0 0 0 4px rgba(6,75,46,.07);
}

input::placeholder {
  color: #A7AFA9;
}

.bal-input {
  height: 79px;
  padding: 6px 12px;
  text-align: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 42px;
  color: var(--green);
  background: #FFFEFB;
}

button {
  width: 100%;
  border: 0;
  outline: 0;
  cursor: pointer;
  font-family: inherit;
}

.primary {
  height: 57px;
  margin-top: 12px;
  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      var(--green),
      var(--green-dark)
    );

  color: #FFFDF7;
  box-shadow: 0 9px 22px rgba(4,61,37,.17);

  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.primary:active {
  transform: scale(.985);
}

.primary:disabled {
  opacity: .45;
  box-shadow: none;
}

.status {
  margin-top: 11px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
}

.status.ok {
  color: #327149;
}

.status.wait {
  color: #9D7B3F;
}

.status.error {
  color: #A85858;
}

/* ==========================================================
   BAL DU JOUR
========================================================== */

.today-bal {
  margin-top: 18px;
  padding-top: 17px;
  border-top: 1px solid var(--border);
  text-align: center;
}

.today-bal-label {
  color: var(--gold);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.8px;
  text-transform: uppercase;
}

.today-bal-value {
  margin-top: 5px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: var(--green);
  font-size: 32px;
  line-height: 1;
}

.today-bal-value span {
  font-size: 13px;
  color: var(--muted);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  font-weight: 600;
}

.history-button {
  height: 43px;
  margin-top: 13px;
  border-radius: 11px;

  background: transparent;
  border: 1px solid rgba(6,75,46,.18);

  color: var(--green);

  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
}

/* ==========================================================
   HISTORIQUE
========================================================== */

.history-overlay {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;

  padding:
    calc(25px + env(safe-area-inset-top))
    18px
    calc(25px + env(safe-area-inset-bottom));

  background: rgba(3,38,24,.43);

  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);

  align-items: center;
  justify-content: center;
}

.history-modal {
  width: 100%;
  max-width: 470px;
  max-height: 78vh;
  overflow: hidden;
  background: var(--cream-card);
  border: 1px solid rgba(185,154,94,.35);
  border-radius: 20px;
  box-shadow: 0 25px 70px rgba(0,30,18,.25);
}

.history-modal-header {
  position: relative;
  padding: 23px 50px 19px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.history-modal-title {
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: var(--green-dark);
  font-size: 23px;
}

.history-modal-subtitle {
  margin-top: 5px;
  color: var(--gold);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.history-close {
  position: absolute;
  right: 14px;
  top: 14px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--green-soft);
  color: var(--green);
  font-size: 20px;
  line-height: 34px;
  padding: 0;
}

.history-list {
  max-height: 55vh;
  overflow-y: auto;
  padding: 8px 20px 17px;
}

.history-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 3px;
  border-bottom: 1px solid rgba(6,75,46,.08);
}

.history-row:last-child {
  border-bottom: 0;
}

.history-date {
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: var(--green-dark);
  font-size: 15px;
}

.history-value {
  color: var(--green);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 20px;
}

.history-value span {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
}

.history-empty {
  padding: 35px 10px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

.footer {
  padding: 15px 0 25px;
  text-align: center;
  color: rgba(6,75,46,.45);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 11px;
}

@media (max-width: 430px) {

  .app {
    padding-left: 13px;
    padding-right: 13px;
  }

  .brand {
    padding-top: 17px;
    padding-bottom: 21px;
  }

  .street-name {
    font-size: 27px;
  }

  .card {
    padding: 18px;
  }
}

</style>
</head>

<body>

<div class="app">

  <header class="brand">

    <div class="logo-box">
      <img

      >

  <!-- RECHERCHE DE RUE -->

    <button
      id="saveButton"

      Enregistrer
    </button>

    <div
      id="saveStatus"
      class="status"
    ></div>


    <div class="today-bal">

      <div class="today-bal-label">
        Aujourd'hui
      </div>

      <div
        id="todayBal"
        class="today-bal-value"

        0 <span>BAL</span>
      </div>

    </div>


    <button
      class="history-button"
      onclick="openHistory()"

    </button>

  </section>


  <footer class="footer">

</div>


<!-- POPUP HISTORIQUE -->

<div
  id="historyOverlay"
  class="history-overlay"
  onclick="closeHistoryFromOverlay(event)"
>

  <div class="history-modal">

    <div class="history-modal-header">

      <button
        class="history-close"
        onclick="closeHistory()"
      >
        ×
      </button>

      <div class="history-modal-title">
        Historique
      </div>

      <div class="history-modal-subtitle">
        Boîtes aux lettres distribuées
      </div>

    </div>

    <div
      id="historyList"
      class="history-list"
    ></div>

  </div>

</div>


<script>

/* ==========================================================
   CONFIGURATION
========================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyIGyX1UivU6zgNL3nvzxqBKaW4c_MLSVWCzk9fgzxgX6XZLEDfvuau7mKPM0phVS4Y/exec';

const FULL_SYNC_INTERVAL = 5 * 60 * 1000;

const API_TIMEOUT = 12000;
const API_RETRIES = 2;
const API_RETRY_DELAY = 900;

const BASE_CACHE_KEY =
  'allauch_base_rues_v6';

const PENDING_WRITES_KEY =
  'allauch_pending_writes_v6';

const DAILY_HISTORY_KEY =
  'allauch_daily_history_v2';

const DAILY_STREETS_KEY =
  'allauch_daily_streets_v1';


/* ==========================================================
   VARIABLES
========================================================== */

let baseRues = [];
let activeEntry = null;

let fullSyncRunning = false;
let pendingFlushRunning = false;
let syncTimer = null;
let saving = false;


/* ==========================================================
   NORMALISATION DES NOMS DE RUE
========================================================== */

function normalizeText(text) {

  return String(text || '')

    .normalize('NFD')

    .replace(
      /[\u0300-\u036f]/g,
      ''
    )

    .toLowerCase()

    .replace(
      /[’']/g,
      ' '
    )

    .replace(
      /[-_/]/g,
      ' '
    )

    .replace(
      /\b(chemin|chem|ch|impasse|imp|avenue|av|boulevard|bd|route|rue|allee|allée|lotissement|lot|traverse|montée|montee|place|cours)\b/g,
      ' '
    )

    .replace(
      /\s+/g,
      ' '
    )

    .trim();
}


/* ==========================================================
   ATTENTE
========================================================== */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


/* ==========================================================
   APPEL GOOGLE APPS SCRIPT JSONP
========================================================== */

function jsonpOnce(
  params,
  timeoutMs = API_TIMEOUT
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 1000000
        );

      const query =
        new URLSearchParams({

          ...params,

          callback:
            callbackName,

          _ts:
            Date.now()

        }).toString();

      const script =
        document.createElement(
          'script'
        );

      let finished = false;

      const timeout =
        setTimeout(
          () => {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error(
                'Délai dépassé'
              )
            );

          },
          timeoutMs
        );


      function cleanup() {

        clearTimeout(
          timeout
        );

        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

        try {

          delete window[
            callbackName
          ];

        }

        catch(e) {

          window[
            callbackName
          ] = undefined;

        }

      }


      window[
        callbackName
      ] =
        function(data) {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          resolve(
            data
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(
            new Error(
              'Erreur réseau'
            )
          );

        };


      script.async = true;

      script.src =
        API_URL +
        '?' +
        query;

      document.head.appendChild(
        script
      );

    }
  );
}


/* ==========================================================
   JSONP AVEC NOUVELLE TENTATIVE
========================================================== */

async function jsonp(
  params,
  options = {}
) {

  const retries =
    options.retries ??
    API_RETRIES;

  const timeout =
    options.timeout ??
    API_TIMEOUT;

  let lastError = null;


  for (
    let attempt = 0;
    attempt <= retries;
    attempt++
  ) {

    try {

      const data =
        await jsonpOnce(
          params,
          timeout
        );

      if (
        !data ||
        data.ok === false
      ) {

        throw new Error(
          data?.message ||
          'Réponse API invalide'
        );

      }

      return data;

    }

    catch(err) {

      lastError = err;

      if (
        attempt < retries
      ) {

        await sleep(
          API_RETRY_DELAY *
          (
            attempt + 1
          )
        );

      }

    }

  }

  throw (
    lastError ||
    new Error(
      'Connexion impossible'
    )
  );
}


/* ==========================================================
   CACHE LOCAL DES RUES
========================================================== */

function saveBaseCache() {

  try {

    localStorage.setItem(
      BASE_CACHE_KEY,
      JSON.stringify(
        baseRues
      )
    );

  }

  catch(e) {

    console.warn(
      'Cache impossible',
      e
    );

  }
}


function loadBaseCache() {

  try {

    const raw =
      localStorage.getItem(
        BASE_CACHE_KEY
      );

    if (!raw) {
      return false;
    }

    const cached =
      JSON.parse(
        raw
      );

    if (
      !Array.isArray(cached) ||
      cached.length === 0
    ) {

      return false;

    }

    baseRues = cached;

    return true;

  }

  catch(e) {

    return false;

  }
}


/* ==========================================================
   ÉCRITURES EN ATTENTE
========================================================== */

function getPendingWrites() {

  try {

    const raw =
      localStorage.getItem(
        PENDING_WRITES_KEY
      );

    if (!raw) {
      return {};
    }

    const parsed =
      JSON.parse(
        raw
      );

    if (
      !parsed ||
      typeof parsed !== 'object'
    ) {

      return {};

    }

    return parsed;

  }

  catch(e) {

    return {};

  }
}


function savePendingWrites(
  pending
) {

  try {

    localStorage.setItem(
      PENDING_WRITES_KEY,
      JSON.stringify(
        pending
      )
    );

  }

  catch(e) {

    console.warn(
      'File locale impossible',
      e
    );

  }
}


function queueBALWrite(
  id,
  bal
) {

  const pending =
    getPendingWrites();

  pending[
    String(id)
  ] = {

    id:
      String(id),

    bal:
      Number(bal),

    updatedAt:
      Date.now()

  };

  savePendingWrites(
    pending
  );
}


/* ==========================================================
   METTRE À JOUR UNE RUE LOCALEMENT
========================================================== */

function updateLocalStreet(
  id,
  bal,
  fait
) {

  const index =
    baseRues.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if (
    index === -1
  ) {

    return;

  }

  baseRues[index].bal =
    Number(bal) || 0;

  if (fait) {

    baseRues[index].fait =
      fait;

  }

  if (
    activeEntry &&
    String(activeEntry.id) ===
    String(id)
  ) {

    activeEntry.bal =
      Number(bal) || 0;

    if (fait) {

      activeEntry.fait =
        fait;

    }

    displayActiveStreet();

  }
}


/* ==========================================================
   ENVOI DES MODIFICATIONS EN ATTENTE
========================================================== */

async function flushPendingWrites() {

  if (
    pendingFlushRunning ||
    !navigator.onLine
  ) {

    return;

  }

  const pending =
    getPendingWrites();

  const entries =
    Object.values(
      pending
    );

  if (
    entries.length === 0
  ) {

    return;

  }

  pendingFlushRunning = true;

  try {

    for (
      const entry
      of entries
    ) {

      const currentPending =
        getPendingWrites();

      const latest =
        currentPending[
          String(entry.id)
        ];

      if (
        !latest ||
        latest.updatedAt !==
        entry.updatedAt
      ) {

        continue;

      }

      try {

        const result =
          await jsonp(

            {
              action:
                'updateBAL',

              id:
                entry.id,

              bal:
                entry.bal
            },

            {
              retries: 2,
              timeout: 12000
            }

          );

        const afterCall =
          getPendingWrites();

        const current =
          afterCall[
            String(entry.id)
          ];

        if (
          current &&
          current.updatedAt ===
          entry.updatedAt
        ) {

          delete afterCall[
            String(entry.id)
          ];

          savePendingWrites(
            afterCall
          );

          updateLocalStreet(

            entry.id,

            result.bal !== undefined
              ? result.bal
              : entry.bal,

            result.fait ||
            (
              entry.bal > 0
                ? 'Oui'
                : undefined
            )

          );

        }

      }

      catch(err) {

        console.warn(
          'Écriture conservée en attente :',
          entry.id,
          err
        );

      }

    }

    saveBaseCache();

  }

  finally {

    pendingFlushRunning = false;

  }
}


/* ==========================================================
   FUSION GOOGLE -> CACHE LOCAL
========================================================== */

function mergeRemoteBase(
  remoteRues
) {

  const pending =
    getPendingWrites();

  const localMap =
    new Map();

  baseRues.forEach(
    item => {

      localMap.set(
        String(item.id),
        item
      );

    }
  );

  const merged = [];

  remoteRues.forEach(
    remote => {

      const id =
        String(remote.id);

      if (
        pending[id]
      ) {

        const local =
          localMap.get(id);

        if (local) {

          merged.push({

            ...remote,

            bal:
              local.bal,

            fait:
              local.fait

          });

        }

        else {

          merged.push(
            remote
          );

        }

      }

      else {

        merged.push(
          remote
        );

      }

    }
  );

  baseRues = merged;

  if (
    activeEntry
  ) {

    const fresh =
      baseRues.find(
        item =>
          String(item.id) ===
          String(activeEntry.id)
      );

    if (fresh) {

      activeEntry = {
        ...fresh
      };

      displayActiveStreet();

    }

  }

  saveBaseCache();

}


/* ==========================================================
   SYNCHRONISATION GOOGLE
========================================================== */

async function fullSync(
  showStatus = false
) {

  if (
    fullSyncRunning ||
    !navigator.onLine
  ) {

    return;

  }

  fullSyncRunning = true;

  try {

    await flushPendingWrites();

    if (showStatus) {

      setGlobalStatus(

        baseRues.length
          ? baseRues.length +
            ' rues • synchronisation…'
          : 'Synchronisation…',

        'wait'

      );

    }

    const data =
      await jsonp(

        {
          action:
            'liste'
        },

        {
          retries: 2,
          timeout: 12000
        }

      );

    const remoteRues =
      data.rues || [];

    if (
      remoteRues.length > 0
    ) {

      mergeRemoteBase(
        remoteRues
      );

    }

    setGlobalStatus(

      baseRues.length +
      ' rues disponibles',

      'ok'

    );

  }

  catch(err) {

    console.warn(
      'Synchronisation Google impossible',
      err
    );

    if (
      baseRues.length
    ) {

      setGlobalStatus(

        baseRues.length +
        ' rues • mode local',

        'wait'

      );

    }

    else {

      setGlobalStatus(
        'Connexion Google indisponible',
        'error'
      );

    }

  }

  finally {

    fullSyncRunning = false;

  }
}


/* ==========================================================
   CHARGEMENT INITIAL
========================================================== */

async function loadBase() {

  const hasCache =
    loadBaseCache();

  if (
    hasCache
  ) {

    setGlobalStatus(

      baseRues.length +
      ' rues disponibles',

      'ok'

    );

  }

  else {

    setGlobalStatus(
      'Chargement des rues…',
      'wait'
    );

  }

  await fullSync(
    !hasCache
  );

  startPeriodicSync();

}


/* ==========================================================
   SYNCHRONISATION PÉRIODIQUE
========================================================== */

function startPeriodicSync() {

  if (
    syncTimer
  ) {

    clearInterval(
      syncTimer
    );

  }

  syncTimer =
    setInterval(
      () => {

        fullSync(
          false
        );

      },
      FULL_SYNC_INTERVAL
    );

}


/* ==========================================================
   RECHERCHE MANUELLE
========================================================== */

function searchStreet() {

  const input =
    document.getElementById(
      'searchInput'
    );

  const container =
    document.getElementById(
      'searchResults'
    );

  const query =
    normalizeText(
      input.value
    );

  container.innerHTML = '';

  if (
    !query
  ) {

    container.style.display =
      'none';

    return;

  }

  const results =
    baseRues

      .filter(
        item => {

          const rue =
            normalizeText(
              item.rue
            );

          return rue.includes(
            query
          );

        }
      )

      .slice(
        0,
        20
      );

  if (
    results.length === 0
  ) {

    container.innerHTML =
      '<div class="result">Aucune rue trouvée</div>';

    container.style.display =
      'block';

    return;

  }

  results.forEach(
    item => {

      const div =
        document.createElement(
          'div'
        );

      div.className =
        'result';

      const fait =
        String(
          item.fait || ''
        ).toLowerCase() === 'oui';

      div.innerHTML =

        '<strong>' +
        escapeHtml(
          item.rue
        ) +
        '</strong>' +

        '<small>' +

        escapeHtml(
          item.jour
        ) +

        ' • n° ' +

        item.ordre +

        ' • ' +

        escapeHtml(
          item.type
        ) +

        ' • ' +

        item.bal +

        ' BAL' +

        (
          fait
            ? ' • FAIT'
            : ' • À FAIRE'
        ) +

        '</small>';


      div.onclick =
        () => {

          input.value =
            item.rue;

          container.style.display =
            'none';

          activateStreet(
            item.id
          );

        };


      container.appendChild(
        div
      );

    }
  );

  container.style.display =
    'block';

}


/* ==========================================================
   ACTIVER UNE RUE
========================================================== */

function activateStreet(
  id
) {

  const item =
    baseRues.find(
      entry =>
        String(entry.id) ===
        String(id)
    );

  if (
    !item
  ) {

    setSaveStatus(
      'Rue introuvable',
      'error'
    );

    return;

  }

  activeEntry = {
    ...item
  };

  displayActiveStreet();

  setSaveStatus(
    '',
    ''
  );

}


/* ==========================================================
   AFFICHAGE DE LA RUE
========================================================== */

function displayActiveStreet() {

  if (
    !activeEntry
  ) {

    return;

  }

  document.getElementById(
    'streetName'
  ).textContent =
    activeEntry.rue;


  document.getElementById(
    'streetMeta'
  ).textContent =

    activeEntry.jour +

    '  •  n° ' +

    activeEntry.ordre +

    '  •  ' +

    activeEntry.type;


  const currentBal =
    Number(
      activeEntry.bal
    ) || 0;


  document.getElementById(
    'currentBal'
  ).textContent =
    currentBal;


  const input =
    document.getElementById(
      'balInput'
    );

  input.disabled =
    false;

  if (
    document.activeElement !==
    input
  ) {

    input.value =
      currentBal;

  }


  document.getElementById(
    'saveButton'
  ).disabled =
    false;


  const fait =
    String(
      activeEntry.fait || ''
    ).toLowerCase();


  const tag =
    document.getElementById(
      'faitTag'
    );


  if (
    fait === 'oui'
  ) {

    tag.innerHTML =
      '<span class="tag oui">✓ FAIT</span>';

  }

  else {

    tag.innerHTML =
      '<span class="tag non">À FAIRE</span>';

  }

}


/* ==========================================================
   ENREGISTRER LES BAL
========================================================== */

async function saveBAL() {

  if (
    !activeEntry ||
    saving
  ) {

    return;

  }

  const input =
    document.getElementById(
      'balInput'
    );

  const bal =
    Number(
      input.value
    );

  if (
    !Number.isFinite(bal) ||
    bal < 0 ||
    !Number.isInteger(bal)
  ) {

    setSaveStatus(
      'Entre un nombre valide.',
      'error'
    );

    return;

  }

  saving = true;

  document.getElementById(
    'saveButton'
  ).disabled =
    true;


  const currentId =
    activeEntry.id;

  const previousBal =
    Number(
      activeEntry.bal
    ) || 0;


  /*
    On mémorise le nombre de BAL présent
    AVANT la première modification
    de cette rue aujourd'hui.
  */

  registerStreetBaseline(
    currentId,
    previousBal
  );


  const fait =
    bal > 0
      ? 'Oui'
      : activeEntry.fait;


  /*
    Mise à jour immédiate sur le téléphone.
  */

  updateLocalStreet(
    currentId,
    bal,
    fait
  );


  /*
    Mise à jour du compteur du jour.
  */

  updateTodayStreet(
    currentId,
    bal
  );


  saveBaseCache();


  /*
    Mise en attente pour Google Sheets.
  */

  queueBALWrite(
    currentId,
    bal
  );


  displayActiveStreet();


  setSaveStatus(

    '✓ ' +
    bal +
    ' BAL enregistrées',

    'ok'

  );


  saving = false;

  document.getElementById(
    'saveButton'
  ).disabled =
    false;


  /*
    Synchronisation Google en arrière-plan.
  */

  flushPendingWrites()
    .catch(
      err => {

        console.warn(
          'Synchro différée',
          err
        );

      }
    );

}

/* ==========================================================
   PROTECTION HTML
========================================================== */

function escapeHtml(text) {

  return String(
    text || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}

/* ==========================================================
   DATE LOCALE
========================================================== */

function getLocalDateKey(
  date = new Date()
) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );

  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}


/* ==========================================================
   HISTORIQUE
========================================================== */

function getDailyHistory() {

  try {

    const raw =
      localStorage.getItem(
        DAILY_HISTORY_KEY
      );

    if (
      !raw
    ) {

      return {};

    }

    const data =
      JSON.parse(
        raw
      );

    if (
      !data ||
      typeof data !==
      'object'
    ) {

      return {};

    }

    return data;

  }

  catch(e) {

    return {};

  }

}


function saveDailyHistory(
  history
) {

  try {

    localStorage.setItem(

      DAILY_HISTORY_KEY,

      JSON.stringify(
        history
      )

    );

  }

  catch(e) {

    console.warn(
      'Historique impossible à sauvegarder',
      e
    );

  }

}

/* ==========================================================
   VALEUR DE DÉPART D'UNE RUE
========================================================== */

function registerStreetBaseline(
  id,
  currentBal
) {

  const data =
    getDailyStreets();

  const today =
    getLocalDateKey();


  /*
    On ne conserve dans ce stockage
    que la journée en cours.
  */

  Object.keys(
    data
  ).forEach(
    dateKey => {

      if (
        dateKey !== today
      ) {

        delete data[
          dateKey
        ];

      }

    }
  );


  if (
    !data[today]
  ) {

    data[today] = {};

  }


  const streetId =
    String(id);


  /*
    Très important :
    la valeur de référence n'est définie
    qu'une seule fois dans la journée.

    Exemple :
    rue = 40 au début

    40 -> 38
    baseline reste 40

    38 -> 45
    baseline reste toujours 40
  */

  if (
    !data[today][streetId]
  ) {

    data[today][streetId] = {

      baseline:
        Number(
          currentBal
        ) || 0,

      current:
        Number(
          currentBal
        ) || 0

    };

  }


  saveDailyStreets(
    data
  );

}


/* ==========================================================
   METTRE À JOUR UNE RUE POUR LE COMPTEUR DU JOUR
========================================================== */

function updateTodayStreet(
  id,
  newBal
) {

  const data =
    getDailyStreets();

  const today =
    getLocalDateKey();

  const streetId =
    String(id);


  if (
    !data[today]
  ) {

    data[today] = {};

  }


  if (
    !data[today][streetId]
  ) {

    data[today][streetId] = {

      baseline:
        0,

      current:
        Number(
          newBal
        ) || 0

    };

  }


  data[today][streetId].current =
    Number(
      newBal
    ) || 0;


  saveDailyStreets(
    data
  );


  recalculateTodayTotal();

}


/* ==========================================================
   RECALCUL DU TOTAL DU JOUR
========================================================== */

function recalculateTodayTotal() {

  const data =
    getDailyStreets();

  const today =
    getLocalDateKey();

  const streets =
    data[today] || {};


  let total = 0;


  Object.values(
    streets
  ).forEach(
    street => {

      const baseline =
        Number(
          street.baseline
        ) || 0;

      const current =
        Number(
          street.current
        ) || 0;


      /*
        Seules les BAL ajoutées
        au-dessus de la valeur de départ
        sont comptabilisées.

        Exemple :

        départ 40 -> 38 = 0
        départ 40 -> 40 = 0
        départ 40 -> 45 = 5

        départ 0 -> 40 = 40
        départ 0 -> 38 = 38
      */

      const contribution =
        Math.max(
          0,
          current - baseline
        );


      total +=
        contribution;

    }
  );


  /*
    On enregistre également le total
    dans l'historique.
  */

  const history =
    getDailyHistory();

  history[today] =
    total;

  saveDailyHistory(
    history
  );


  refreshTodayBal();

}


/* ==========================================================
   AFFICHAGE DU COMPTEUR DU JOUR
========================================================== */

function refreshTodayBal() {

  const data =
    getDailyStreets();

  const today =
    getLocalDateKey();

  const streets =
    data[today] || {};


  let value = 0;


  Object.values(
    streets
  ).forEach(
    street => {

      const baseline =
        Number(
          street.baseline
        ) || 0;

      const current =
        Number(
          street.current
        ) || 0;


      value +=
        Math.max(
          0,
          current - baseline
        );

    }
  );


  const element =
    document.getElementById(
      'todayBal'
    );


  if (
    element
  ) {

    element.innerHTML =
      value +
      ' <span>BAL</span>';

  }

}

/* ==========================================================
   AFFICHER HISTORIQUE
========================================================== */

function renderHistory() {

  const history =
    getDailyHistory();

  const container =
    document.getElementById(
      'historyList'
    );

  container.innerHTML = '';

  const dates =
    Object.keys(
      history
    )
    .sort(
      (a, b) =>
        b.localeCompare(a)
    );

  if (
    dates.length === 0
  ) {

    container.innerHTML =
      '<div class="history-empty">' +
      'Aucun historique pour le moment.' +
      '</div>';

    return;

  }

  dates.forEach(
    dateKey => {

      const parts =
        dateKey.split(
          '-'
        );

      const date =
        new Date(

          Number(
            parts[0]
          ),

          Number(
            parts[1]
          ) - 1,

          Number(
            parts[2]
          )

        );

      const label =
        date.toLocaleDateString(

          'fr-FR',

          {

            weekday:
              'long',

            day:
              '2-digit',

            month:
              'long',

            year:
              'numeric'

          }

        );

      const value =
        Number(
          history[
            dateKey
          ] || 0
        );

      const row =
        document.createElement(
          'div'
        );

      row.className =
        'history-row';

      row.innerHTML =

        '<div class="history-date">' +

        escapeHtml(
          label
        ) +

        '</div>' +

        '<div class="history-value">' +

        value +

        ' <span>BAL</span>' +

        '</div>';

      container.appendChild(
        row
      );

    }
  );

}
