<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test API Boîtage</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      padding: 30px 20px;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 18px;
      font-size: 20px;
      font-weight: 700;
      background: #007aff;
      color: white;
    }

    #resultat {
      margin-top: 20px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      font-size: 14px;
      background: #f2f2f7;
      padding: 15px;
      border-radius: 12px;
      min-height: 100px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📬 Test Google Sheet</h1>

  <button id="testBtn">
    Tester Google Sheet
  </button>

  <div id="resultat">
    En attente du test…
  </div>

</div>


<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxhbYmORw_HilfITh6G58wLQ5P89PptlcVcMZm0ur0NJCl0fOp7B7d9f6yvDGhvfdL_BA/exec';


function jsonp(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      'callback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement('script');

    const timeout =
      setTimeout(function() {

        nettoyage();

        reject(
          new Error('Timeout API')
        );

      }, 15000);


    function nettoyage() {

      clearTimeout(timeout);

      try {
        delete window[callbackName];
      } catch(e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }


    window[callbackName] =
      function(data) {

        nettoyage();
        resolve(data);

      };


    params.callback =
      callbackName;

    params.t =
      Date.now();


    const query =
      Object.keys(params)
        .map(function(key) {

          return (
            encodeURIComponent(key) +
            '=' +
            encodeURIComponent(params[key])
          );

        })
        .join('&');


    script.src =
      API_URL +
      '?' +
      query;


    script.onerror =
      function() {

        nettoyage();

        reject(
          new Error('Erreur chargement script JSONP')
        );

      };


    document.body.appendChild(script);

  });
}


async function lancerTest() {

  const zone =
    document.getElementById('resultat');

  zone.textContent =
    'Test en cours…';

  try {

    const data =
      await jsonp({

        action: 'getRue',

        rue:
          'Boulevard Marcel Delestrade'

      });


    zone.textContent =
      'SUCCÈS ✅\n\n' +
      JSON.stringify(
        data,
        null,
        2
      );

  }

  catch(error) {

    zone.textContent =
      'ERREUR ❌\n\n' +
      error.message;

  }

}


document
  .getElementById('testBtn')
  .addEventListener(
    'click',
    lancerTest
  );

</script>

</body>
</html>
